<title>Agência Terceiro Andar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: black brand rail (sidebar / bottom bar) from the logo, content follows the viewer's theme; logo's rounded bars reused for progress and stripes */
:root{
  --brand-bg:#0C0C0C; --brand-fg:#FFFFFF; --brand-muted:#9A9A9A; --brand-red:#E83451;
  --bg:#F4F4F3; --surface:#FFFFFF; --surface-2:#ECECEA; --ink:#0C0C0C; --muted:#5E5E5B; --line:#DEDEDA;
  --gold:#A87A00; --accent:#D42A46; --accent-btn:#E83451; --accent-ink:#FFFFFF; --accent-soft:#FCE4E8;
  --crit:#D9480F; --crit-soft:#FDE7DC; --high:#A86E06; --high-soft:#FBF0D6; --med:#2F63D0; --med-soft:#E2EAFB; --low:#6A6A66; --low-soft:#ECECEA; --ok:#1F8A55; --ok-soft:#DCF2E6;
  --shadow:0 1px 2px rgba(12,12,12,.06),0 8px 24px rgba(12,12,12,.08);
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0C; --surface:#151515; --surface-2:#1F1F1F; --ink:#F4F4F4; --muted:#A3A3A0; --line:#2B2B2B;
  --gold:#F5C518; --accent:#F2576F; --accent-btn:#E83451; --accent-ink:#FFFFFF; --accent-soft:#3A1219;
  --crit:#FF7A45; --crit-soft:#3B1D10; --high:#F2B544; --high-soft:#3A2C10; --med:#86A9F5; --med-soft:#18233D; --low:#A3A3A0; --low-soft:#232323; --ok:#55CC8A; --ok-soft:#123222;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --surface:#151515; --surface-2:#1F1F1F; --ink:#F4F4F4; --muted:#A3A3A0; --line:#2B2B2B;
  --gold:#F5C518; --accent:#F2576F; --accent-btn:#E83451; --accent-ink:#FFFFFF; --accent-soft:#3A1219;
  --crit:#FF7A45; --crit-soft:#3B1D10; --high:#F2B544; --high-soft:#3A2C10; --med:#86A9F5; --med-soft:#18233D; --low:#A3A3A0; --low-soft:#232323; --ok:#55CC8A; --ok-soft:#123222;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
a{color:var(--accent)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--brand-bg);color:var(--brand-fg);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.15;display:block}
.brand small{display:block;font-size:11.5px;color:var(--brand-muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;color:var(--brand-muted);font-weight:600;position:relative}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:#1C1C1C;color:var(--brand-fg)}
.nav button[aria-current="page"]{background:#1F1F1F;color:var(--brand-fg)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:5px;border-radius:0 4px 4px 0;background:var(--brand-red)}
.nav .badge{margin-left:auto;background:var(--brand-red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-family:var(--f-mono)}
.who{display:flex;gap:10px;align-items:center;background:#171717;border:1px solid #262626;border-radius:12px;padding:9px 10px;color:var(--brand-fg)}
.who b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font-size:11.5px;color:var(--brand-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-x{margin-left:auto;border:1px solid #333;background:none;color:var(--brand-muted);border-radius:7px;font-size:11.5px;padding:3px 7px;flex:none}
.who-x:hover,.who-x.armed{color:#fff;border-color:var(--brand-red)}
.linkbox{background:var(--brand-bg);color:var(--brand-fg);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.linkbox h2{font-size:18px;color:#fff;display:flex;align-items:center;gap:10px}
.linkbox h2::before{content:"";width:22px;height:8px;border-radius:3px;background:var(--brand-red);flex:none}
.linkbox p{margin:0;color:#CFCFCF;font-size:14px}
.linkbox .btn{background:#1C1C1C;border-color:#333;color:#fff}
.linkbox .btn:hover{border-color:var(--brand-red)}
.linkbox .btn.ghost{background:none;border-color:transparent;color:#9A9A9A}
.sync{margin-top:auto;font-size:12px;color:var(--brand-muted);padding:0 8px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand-muted);flex:none}
.dot.on{background:#55CC8A} .dot.warn{background:#F2B544}
main{min-width:0;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:28px}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent-btn);color:var(--accent-ink);border-color:var(--accent-btn)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 .sub{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.alert .v{color:var(--crit)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.obj[aria-pressed="true"]{background:var(--accent-btn);color:var(--accent-ink);border-color:var(--accent-btn)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.p-critico{background:var(--crit-soft);color:var(--crit)} .p-alto{background:var(--high-soft);color:var(--high)}
.p-medio{background:var(--med-soft);color:var(--med)} .p-baixo{background:var(--low-soft);color:var(--low)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:5px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.stripe{align-self:stretch;border-radius:3px;background:var(--line)}
.s-critico{background:var(--crit)} .s-alto{background:var(--high)} .s-medio{background:var(--med)} .s-baixo{background:var(--low)} .s-ok{background:var(--ok)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px}
.when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.when.late{color:var(--crit);font-weight:700} .when.soon{color:var(--high);font-weight:700}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.filters .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;max-width:100%}
.funnel{display:flex;flex-direction:column;gap:8px}
.fbar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent-btn);border-radius:4px}
.bar.ok>i{background:var(--ok)} .bar.mute>i{background:var(--low)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff;flex:none}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
button.card:hover{border-color:var(--muted)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{font-size:15.5px;overflow-wrap:anywhere}
.card .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.alertbox{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--high);background:var(--high-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.alertbox b{color:var(--high)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
input.search{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;min-width:0;width:240px;max-width:100%}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.health i{width:10px;height:10px;border-radius:3px;display:inline-block}
.h-ok{color:var(--ok)} .h-ok i{background:var(--ok)}
.h-warn{color:var(--high)} .h-warn i{background:var(--high)}
.h-risk{color:var(--crit)} .h-risk i{background:var(--crit)}
/* services */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.svc{background:var(--brand-bg);color:var(--brand-fg);border:0;border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:170px;position:relative;overflow:hidden}
.svc:hover{outline:2px solid var(--brand-red);outline-offset:0}
.svc .ix{font-family:var(--f-mono);font-size:12px;color:var(--brand-muted)}
.svc h3{font-size:19px;color:#fff}
.svc p{margin:0;color:#C9C9C9;font-size:14px}
.svc .bars{display:flex;gap:6px;margin-top:auto}
.svc .bars span{height:8px;border-radius:3px;background:#fff}
.svc .bars span:first-child{background:var(--brand-red)}
.deck{background:var(--brand-bg);color:var(--brand-fg);border-radius:16px;padding:28px clamp(18px,4vw,44px);display:flex;flex-direction:column;gap:22px}
.deck .kick{font-family:var(--f-mono);font-size:12px;color:var(--brand-red);letter-spacing:.08em;text-transform:uppercase}
.deck h2{font-size:clamp(26px,4vw,40px);line-height:1.08;color:#fff}
.deck .tag{font-size:clamp(16px,2vw,19px);color:#D6D6D6;max-width:62ch;margin:0}
.deck .cols{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.deck h4{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.deck h4::before{content:"";width:16px;height:6px;border-radius:2px;background:var(--brand-red)}
.deck ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.deck li{padding-left:16px;position:relative;color:#EDEDED;font-size:15px}
.deck li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:4px;border-radius:1px;background:#fff}
.deck .why li{font-size:16.5px}
.deck .what{color:#D6D6D6;font-size:15.5px;margin:0;max-width:70ch}
.deck .foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid #2B2B2B;padding-top:16px}
.deck .btn{background:#1C1C1C;border-color:#333;color:#fff}
.deck .btn.primary{background:var(--brand-red);border-color:var(--brand-red)}
.step{display:flex;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.ck[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ck svg{width:14px;height:14px}
.step .tx{flex:1;min-width:0}
.step .tx small{display:block;color:var(--muted);font-size:12px}
.ms{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.ms:first-child{border-top:0}
.ms .t{font-weight:600;overflow-wrap:anywhere}
.ms .m{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
.ms select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:13px}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(8,8,8,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:660px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h2{font-size:19px}
.mb{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mf{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.mf .spacer{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld>small{color:var(--muted);font-size:12px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.sec h3{font-family:var(--f-body);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.note{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 8px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.qa{display:flex;flex-direction:column;gap:5px}
.qa label{font-weight:600;font-size:14px}
.qa textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;min-height:54px;resize:vertical;width:100%}
.stars{display:flex;gap:4px}
.stars button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:32px;font-weight:700}
.stars button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.cr:hover{border-color:var(--muted)}
.thumb{aspect-ratio:1/1;max-width:100%;width:100%;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;text-align:center}
.thumb .ph svg{width:30px;height:30px}
.thumb .kind{position:absolute;left:8px;top:8px;background:rgba(12,12,12,.75);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.cr .bd{padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.cr .bd b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .bd small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{background:var(--surface-2);border-radius:10px;overflow:hidden;display:grid;place-items:center;max-height:60vh}
.preview img,.preview video{max-width:100%;max-height:60vh;display:block}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:14px}
.drop.on{border-color:var(--accent-btn);background:var(--accent-soft);color:var(--accent)}
.mini{display:flex;gap:6px;overflow-x:auto}
.mini button{border:0;padding:0;background:var(--surface-2);border-radius:8px;overflow:hidden;width:64px;height:64px;flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.mini img{width:100%;height:100%;object-fit:cover}

 const late=ms.filter(m=>msOpen(m)&&m.state!=='Aguardando cliente'&&m.due&&daysTo(m.due)<0).length;
 if(late){s-=Math.min(45,late*15);why.push(late+' marco'+(late>1?'s':'')+' atrasado'+(late>1?'s':''))}
 const w=ms.filter(m=>m.state==='Aguardando cliente'&&(daysSince(m.waitingSince)||0)>5).length;
 if(w){s-=Math.min(30,w*10);why.push(w+' item'+(w>1?'s':'')+' parado'+(w>1?'s':'')+' com o cliente há mais de 5 dias')}

 if(ds!==null&&ds>60){s-=25;why.push(past?'último contato há '+ds+' dias':'nenhum contato registrado')}else if(ds!==null&&ds>30){s-=15;why.push(past?'último contato há '+ds+' dias':'nenhum contato registrado')}

   <div class="list">${meets.length?meets.map(meetingRow).join(''):emptyBox('Nenhuma reunião nesse filtro','Agende pelo botão “+ Reunião”.')}</div></section>
  <section class="panel"><h2>Próximos marcos dos projetos <span class="sub">${ms.length}</span></h2>

   <div class="funnel">${PIPE.map(p=>{const n=S.clients.filter(c=>c.stage===p).length;return `<div class="fbar"><span>${p}</span><span class="bar ${p==='Fechado'?'ok':p==='Perdido'?'mute':''}"><i style="width:${n/pipeMax*100}%"></i></span><span class="num">${n}</span></div>`}).join('')}</div></section>

function clientCard(c){const nm=S.meetings.filter(m=>m.clientId===c.id&&parseD(m.when)>new Date()).sort((a,b)=>parseD(a.when)-parseD(b.when))[0];
 const op=S.projects.filter(p=>p.clientId===c.id&&!projDone(p)).length;const h=health(c);
 const pill=c.stage==='Fechado'?'p-ok':c.stage==='Perdido'?'p-baixo':'p-acc';
 return `<button class="card" data-act="open-client" data-id="${c.id}"><div class="top"><span class="row" style="flex-wrap:nowrap;gap:10px;min-width:0">${clientLogo(c,38)}<h3>${esc(c.name)}</h3></span><span class="pill ${pill}">${esc(c.stage)}</span></div>
 ${h?`<div>${healthTag(h)}</div>`:''}
 ${c.primaryObjective&&oName(c.primaryObjective)?`<div><span class="pill p-medio">Foco: ${esc(oName(c.primaryObjective))}</span></div>`:''}
 <div class="meta"><span>${esc(c.segment||'Sem segmento')}</span><span>${money(c.value)}/mês</span><span>${esc(mName(c.ownerId))}</span></div>
 <div class="meta"><span>${op} projeto${op===1?'':'s'} em andamento</span><span>${nm?'Reunião '+fDT(nm.when):'Sem reunião marcada'}</span></div>
 ${c.nextStep?`<div class="meta"><span>Próximo passo: ${esc(c.nextStep)}${c.nextStepDate?' · '+fD(c.nextStepDate):''}</span></div>`:''}</button>`}

 ${list.length?`<div class="cards">${list.map(clientCard).join('')}</div>`:emptyBox(S.clients.length?'Nenhum cliente nesta lista':'Nenhum cliente cadastrado ainda','Use “+ Cliente” para adicionar um contato em prospecção ou um cliente fechado.')}`}

/* ---------- onboarding ---------- */
function vOnboarding(){
 if(ui.svc&&byId('services',ui.svc))return svcDeck(byId('services',ui.svc));
 const tabs=`<div class="tabs" role="tablist"><button role="tab" data-act="obtab" data-v="svc" aria-selected="${ui.obTab==='svc'}">Apresentar serviços</button><button role="tab" data-act="obtab" data-v="cli" aria-selected="${ui.obTab==='cli'}">Onboarding dos clientes</button></div>`;
 const head=`<div class="head"><div><h1>Onboarding</h1><p>Apresente as soluções da agência e acompanhe a entrada de cada cliente.</p></div><div class="row">${ui.obTab==='svc'?'<button class="btn primary" data-act="pres-complete">▶ Apresentação completa</button><button class="btn" data-act="pres-pick">▶ Apresentar serviços</button>':''}${ui.obTab==='svc'&&isAdmin()?'<button class="btn" data-act="new-service">+ Serviço</button>':''}</div></div>`;
 if(ui.obTab==='svc'){const L=svcs();
  return head+tabs+(L.length?`<div class="svc-grid">${L.map((s,i)=>`<button class="svc" data-act="open-svc" data-id="${s.id}"><span class="ix">${pad(i+1)} / ${pad(L.length)}</span><h3>${esc(s.name)}</h3><p>${esc(s.tagline)}</p><span class="bars"><span style="width:${28+i*6}px"></span><span style="width:12px"></span></span></button>`).join('')}</div>
   <p style="color:var(--muted);font-size:13px;margin:0">Toque em um serviço para abrir a apresentação em tela cheia. Todo o conteúdo pode ser editado conforme a agência evoluir.</p>`
   :emptyBox('Nenhum serviço cadastrado','<br><button class="btn primary" style="margin-top:10px" data-act="svc-defaults">Carregar os 5 serviços da agência</button>'));}
 const pool=S.clients.filter(c=>c.stage==='Fechado'||c.onboarding?.startedAt||['Proposta enviada','Negociação'].includes(c.stage));
 const rows=pool.map(c=>{const ob=c.onboarding||{};const done=CHECK.filter(i=>ob.checklist?.[i.id]?.done).length;const pct=Math.round(done/CHECK.length*100);
  const pend=CHECK.filter(i=>i.who==='cliente'&&!ob.checklist?.[i.id]?.done).length;
  return {c,ob,done,pct,pend}}).sort((a,b)=>a.pct-b.pct);
 return head+tabs+(rows.length?`<div class="cards">${rows.map(({c,ob,done,pct,pend})=>`<button class="card" data-act="open-onboarding" data-id="${c.id}">
  <div class="top"><h3>${esc(c.name)}</h3><span class="pill ${pct===100?'p-ok':ob.startedAt?'p-acc':''}">${pct===100?'Concluído':ob.startedAt?'Em onboarding':'Não iniciado'}</span></div>
  <div class="row" style="flex-wrap:nowrap"><span class="bar ${pct===100?'ok':''}" style="flex:1"><i style="width:${pct}%"></i></span><span class="num" style="font-size:13px">${done}/${CHECK.length}</span></div>
  <div class="meta">${(ob.services||[]).map(sName).filter(Boolean).map(n=>`<span class="pill">${esc(n)}</span>`).join('')||'<span>Serviços ainda não definidos</span>'}</div>
  <div class="meta"><span>${ob.startedAt?'Início '+fD(ob.startedAt):esc(c.stage)}</span>${ob.startedAt&&pend?`<span style="color:var(--high);font-weight:600">${pend} pendência${pend>1?'s':''} do cliente</span>`:''}</div></button>`).join('')}</div>`
 :emptyBox('Nenhum cliente para onboarding ainda','Clientes com proposta enviada, em negociação ou fechados aparecem aqui.'))}

function svcDeck(s){const L=svcs();const i=L.findIndex(x=>x.id===s.id);const prev=L[i-1],next=L[i+1];
 const ul=(t,cls)=>{const a=lines(t);return a.length?`<ul class="${cls||''}">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p style="color:#888;margin:0">—</p>'};
 return `<div class="row" style="justify-content:space-between"><button class="btn" data-act="close-svc">‹ Todos os serviços</button><span class="row"><button class="btn primary" data-act="pres-svc" data-id="${s.id}">▶ Apresentar em slides</button>${isAdmin()?`<button class="btn" data-act="edit-service" data-id="${s.id}">Editar conteúdo</button>`:''}</span></div>
 <article class="deck">
  <div><div class="kick">Serviço ${pad(i+1)} de ${pad(L.length)}</div><h2 style="margin-top:8px">${esc(s.name)}</h2></div>
  <p class="tag">${esc(s.tagline)}</p>
  <p class="what">${esc(s.what)}</p>
  <div><h4>Por que trabalhar com isso</h4>${ul(s.why,'why')}</div>
  <div class="cols"><div><h4>Para quem faz sentido</h4>${ul(s.forWho)}</div><div><h4>O que entregamos</h4>${ul(s.deliverables)}</div></div>
  <div class="cols"><div><h4>Como medimos o resultado</h4>${ul(s.metrics)}</div><div><h4>Quando aparecem os resultados</h4><p class="what">${esc(s.timeToResult||'—')}</p></div></div>
  <div style="background:#161616;border-radius:12px;padding:16px"><h4>Perguntas para fazer ao cliente</h4>${ul(s.questions)}</div>
  <div class="foot">${prev?`<button class="btn" data-act="open-svc" data-id="${prev.id}">‹ ${esc(prev.name)}</button>`:'<span></span>'}${next?`<button class="btn primary" data-act="open-svc" data-id="${next.id}">${esc(next.name)} ›</button>`:'<button class="btn primary" data-act="close-svc">Encerrar apresentação</button>'}</div>
 </article>`}

 const done=CHECK.filter(i=>ob.checklist?.[i.id]?.done).length;

 $('#modal').innerHTML=`<div class="mh"><div><h2>Onboarding · ${esc(c.name)}</h2><div style="font-size:13px;color:var(--muted)">${ob.startedAt?'Iniciado em '+fD(ob.startedAt):'Ainda não iniciado'} · ${done}/${CHECK.length} etapas</div></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>

   ${(ob.services||[]).length?`<button class="btn sm" style="margin-top:10px" data-act="ob-projects" data-id="${cid}">Criar um projeto no fluxo para cada serviço</button>`:''}</div>
  <div class="sec"><h3>Checklist de entrada</h3><div class="row" style="flex-wrap:nowrap;margin-bottom:6px"><span class="bar ok" style="flex:1"><i style="width:${done/CHECK.length*100}%"></i></span></div>
   <div><b style="font-size:13px">Agência</b>${CHECK.filter(i=>i.who==='agencia').map(ck).join('')}</div>
   <div style="margin-top:10px"><b style="font-size:13px">Cliente envia</b>${CHECK.filter(i=>i.who==='cliente').map(ck).join('')}</div></div>

 openModal('',{rerender:draw});draw()}

async function setMsState(pid,mid,state){const p=byId('projects',pid);const ms=(p.milestones||[]).map(m=>{if(m.id!==mid)return m;const r={...m,state};
 if(state==='Aguardando cliente'&&m.state!=='Aguardando cliente')r.waitingSince=today();if(state!=='Aguardando cliente')delete r.waitingSince;
 if(state==='Concluído')r.doneAt=today();else delete r.doneAt;return r});
 if(state==='Concluído'){const nx=ms.find(m=>m.state!=='Concluído');if(nx&&!nx.startedAt)ms[ms.indexOf(nx)]={...nx,startedAt:today()}}
 const all=ms.length&&ms.every(m=>m.state==='Concluído');await put('projects',pid,{...p,milestones:ms});
 if(all&&p.clientId)ensureFollow(p.clientId,{kind:'project',id:p.id,label:'Projeto: '+p.title});
 {const nx2=ms.find(m=>m.state!=='Concluído');const cur=ms.find(m=>m.id===mid);const pl=p.title+(p.clientId?' · '+cName(p.clientId):'');
  if(state==='Concluído')sysPost(`**${actor()}** concluiu a etapa **${cur.title}** em ${pl}.${nx2?` Próximo: **${nx2.title}**${nx2.assigneeId?' com **'+first(nx2.assigneeId)+'**':''}`:' Todas as etapas concluídas.'}`,{act:'open-project',id:pid});
  else if(state==='Aguardando cliente')sysPost(`**${actor()}** marcou **${cur.title}** em ${pl} como **aguardando o cliente**`,{act:'open-project',id:pid})}
 const nx=ms.find(m=>m.state!=='Concluído');toast(all?'Todas as etapas concluídas. Conclua o projeto quando quiser.':state==='Concluído'&&nx?'Passou para '+nx.title+(nx.assigneeId?' · '+mName(nx.assigneeId):''):'Marco: '+state)}

function vAgenda(){const now=new Date();const sc=ui.agScope;const mm=myMember();const mine=ui.agMine&&mm;
 const all=S.meetings.filter(m=>mScope(m)===sc&&(!mine||(m.memberIds||[]).includes(mm.id))).sort((a,b)=>parseD(a.when)-parseD(b.when));
 const cnt=s=>S.meetings.filter(m=>mScope(m)===s&&parseD(m.when)>now).length;
 const groups={};const lbl=m=>{const d=parseD(m.when);if(!d)return'Sem data';if(d<now)return null;const n=daysTo(ymd(d));if(n===0)return'Hoje';if(n===1)return'Amanhã';if(n<=7)return'Próximos 7 dias';return'Mais adiante'};
 let body='';
 if(ui.agTab==='prox'){all.forEach(m=>{const g=lbl(m);if(g)(groups[g]=groups[g]||[]).push(m)});
  body=['Hoje','Amanhã','Próximos 7 dias','Mais adiante','Sem data'].filter(g=>groups[g]).map(g=>`<section class="panel"><h2>${g} <span class="sub">${groups[g].length}</span></h2><div class="list">${groups[g].map(meetingRow).join('')}</div></section>`).join('')||emptyBox(sc==='interna'?'Nenhum compromisso interno agendado':'Nenhuma reunião com cliente agendada',sc==='interna'?'Marque reuniões de equipe, treinamentos e alinhamentos pelo botão acima.':'Use “+ Reunião com cliente” para marcar a próxima.');
 }else{const past=all.filter(m=>parseD(m.when)<now).reverse();body=past.length?`<section class="panel"><div class="list">${past.map(meetingRow).join('')}</div></section>`:emptyBox('Nada realizado ainda','')}
 const soon=all.filter(m=>{const d=parseD(m.when);return d>now&&d-now<48*36e5}).length;
 return `<div class="head"><div><h1>Agenda</h1><p>${soon?`<b style="color:var(--crit)">${soon} compromisso${soon>1?'s':''} ${sc==='interna'?'interno':'com cliente'}${soon>1?'s':''} nas próximas 48h.</b>`:`Nenhum compromisso ${sc==='interna'?'interno':'com cliente'} nas próximas 48h.`}</p></div>
  <div class="row"><button class="btn ${sc==='interna'?'primary':''}" data-act="new-meeting" data-scope="interna">+ Interna</button><button class="btn ${sc==='externa'?'primary':''}" data-act="new-meeting" data-scope="externa">+ Reunião com cliente</button></div></div>
 <div class="tabs" role="tablist" style="font-size:16px"><button role="tab" data-act="agscope" data-v="externa" aria-selected="${sc==='externa'}">Externa · clientes <span class="num">${cnt('externa')}</span></button><button role="tab" data-act="agscope" data-v="interna" aria-selected="${sc==='interna'}">Interna · equipe <span class="num">${cnt('interna')}</span></button></div>
 <p style="margin:-8px 0 0;color:var(--muted);font-size:13px">${sc==='interna'?'Reuniões de equipe, treinamentos e alinhamentos do time.':'Prospecção, diagnóstico, propostas, aprovações e resultados com os clientes.'}</p>
 ${mm?`<div class="chips"><button class="chip" data-act="agmine" aria-pressed="${!!ui.agMine}">Só as que eu participo</button></div>`:''}
 <div class="tabs" role="tablist"><button role="tab" data-act="agtab" data-v="prox" aria-selected="${ui.agTab==='prox'}">Agendadas</button><button role="tab" data-act="agtab" data-v="pass" aria-selected="${ui.agTab==='pass'}">Realizadas</button></div>${body}`}

function easterOf(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function nthSunday(y,m,n){const d=new Date(y,m-1,1);const off=(7-d.getDay())%7;return new Date(y,m-1,1+off+7*(n-1))}

 else if(r==='MAES')d=nthSunday(y,5,2);else if(r==='PAIS')d=nthSunday(y,8,2);else if(r==='BF')d=blackFriday(y);else if(r==='CM')d=addD(blackFriday(y),3);
 else if(r==='D256')d=addD(new Date(y,0,1),255);else{const[mm,dd]=r.split('-').map(Number);d=new Date(y,mm-1,dd)}
 const date=ymd(d);return{key:date+':'+id,id,date,name,cat,kw:kw?kw.split(','):[],tip,month}});
 return memoDates[y]=out}

 const id=ch+'__'+today()+'__'+mm.id;const ex=CHAT.find(d=>d.id===id);const msgs=[...(ex?.msgs||[]),{id:uid(),text,at:new Date().toISOString()}];
 ui.chatDraft={...(ui.chatDraft||{}),[ch]:''};ta.value='';chatKeep=true;
 const rec={ch,date:today(),author:mm.id,msgs};
 if(mode==='db'){try{await db.collection('chat').doc(id).set(rec)}catch(e){toast(e?.code==='quota_exceeded'?'O chat atingiu o limite de armazenamento.':'Mensagem não enviada. Tente de novo.');ta.value=text;return}}
 else{const i=CHAT.findIndex(d=>d.id===id);if(i>=0)CHAT[i]={id,...rec};else CHAT.push({id,...rec});chatKeep=true;refresh()}}

 if(d!==last){out+=`<div class="chat-day"><span>${d===today()?'Hoje':d===ymd(addD(new Date(),-1))?'Ontem':WD[t.getDay()]+', '+fD(d)}</span></div>`;last=d;lastA=''}
 const cont=m.author===lastA&&(t-lastT)<5*60000;lastA=m.author;lastT=t;const mine=mm&&m.author===mm.id;const mem=byId('members',m.author);
 const toMe=mm&&!mine&&new RegExp('@('+rxEsc(mm.name.split(' ')[0])+'|todos|equipe)(?![\\wÀ-ÿ])','i').test(m.text||'');
 if(m.sys){lastA='';const tx=esc(m.text||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');return out+`<div class="msg sys"><span class="sys-ic">${avatar(mem,22)}</span><div class="msg-b"><div class="msg-t">${tx}</div><small>${pad(t.getHours())}:${pad(t.getMinutes())}${m.link?` · <button class="lnk" data-act="${esc(m.link.act)}" data-id="${esc(m.link.id)}" ${m.link.v?`data-v="${esc(m.link.v)}"`:''}>Abrir</button>`:''}</small></div></div>`}
 return out+`<div class="msg ${cont?'cont':''} ${toMe?'tome':''} ${mine?'mine':''}">${cont?'<span class="msg-av"></span>':`<span class="msg-av">${avatar(mem,30)}</span>`}<div class="msg-b">${cont?'':`<div class="msg-h"><b>${esc(mine?'Você':mem?.name||'Alguém')}</b><small>${pad(t.getHours())}:${pad(t.getMinutes())}</small></div>`}<div class="msg-t">${fmtMsg(m.text||'')}</div></div>${mine?`<button class="msg-del" data-act="chat-del" data-id="${esc(m.doc)}" data-v="${esc(m.id)}" title="Apagar mensagem" aria-label="Apagar mensagem">×</button>`:''}</div>`}).join('')}
const rxEsc=x=>String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

 const btn=document.getElementById('cw-btn');if(btn){btn.setAttribute('aria-expanded',cwOpen);btn.classList.toggle('on',cwOpen)}

 document.getElementById('cw-tabs').hidden=CH_LIST.length<2;document.getElementById('cw-tabs').innerHTML=CH_LIST.map(c=>{const n=c.id===cwCh?0:chatUnread(c.id);return `<button data-act="cw-ch" data-v="${c.id}" aria-pressed="${c.id===cwCh}">${c.l}${n?`<span class="cw-n">${n}</span>`:''}</button>`}).join('');
 const box=document.getElementById('cw-msgs');const atB=box.scrollHeight-box.scrollTop-box.clientHeight<60||!box.dataset.ch||box.dataset.ch!==cwCh;

 if(atB)box.scrollTop=box.scrollHeight;markRead(cwCh);

 const ch=cwCh;const id=ch+'__'+today()+'__'+mm.id;const ex=CHAT.find(d=>d.id===id);const msgs=[...(ex?.msgs||[]),{id:uid(),text,at:new Date().toISOString()}];
 ui.chatDraft={...(ui.chatDraft||{}),[ch]:''};ta.value='';ta.style.height='auto';const rec={ch,date:today(),author:mm.id,msgs};

 else{const i=CHAT.findIndex(d=>d.id===id);if(i>=0)CHAT[i]={id,...rec};else CHAT.push({id,...rec});}

 if(cwLastNewest&&newest>cwLastNewest){const fresh=all.filter(m=>m.at>cwLastNewest&&(!mm||m.author!==mm.id));const m=fresh[fresh.length-1];

const WDF=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function todayItems(mm){const t0=today();const out=[];
 S.todos.filter(t=>t.assigneeId===mm.id&&t.status!=='Concluída'&&t.due&&t.due<=t0).forEach(t=>out.push({k:'Tarefa',cls:'p-acc',t:t.title,c:t.clientId,due:t.due,time:t.dueTime||'',late:taskState(t)==='late',urg:!!t.urgent,act:['task-open',t.id],extra:tkS(t)}));
 S.follows.filter(f=>f.status!=='Feito'&&fuOwns(f,mm.id)&&fuState(f)!=='ok').forEach(f=>out.push({k:'Follow-up',cls:'p-medio',t:f.type+(f.source?.label?' · '+f.source.label:''),c:f.clientId,due:f.dueTo||f.dueFrom,late:fuState(f)==='late',act:['fu-do',f.id]}));
 allMs().filter(m=>m.assigneeId===mm.id&&msOpen(m)&&!projDone(m.project)&&m.due&&m.due<=t0).forEach(m=>out.push({k:'Etapa de projeto',cls:'p-alto',t:m.title+' · '+m.project.title,c:m.project.clientId,due:m.due,late:m.due<t0,act:['open-project',m.project.id],extra:m.state}));
 S.catalog.forEach(d=>(d.items||[]).filter(i=>i.assigneeId===mm.id&&i.status!=='Publicado'&&i.date&&i.date<=t0&&i.date>=ymd(addD(new Date(),-7))).forEach(i=>out.push({k:'Catálogo',cls:'p-ok',t:(i.format||'Conteúdo')+' · '+(i.theme||''),c:d.clientId,due:i.date,late:i.date<t0,act:['cat-goto',d.clientId,d.month]})));
 S.creatives.filter(c=>c.memberId===mm.id&&c.status==='Ajustes solicitados').forEach(c=>out.push({k:'Ajuste de criativo',cls:'p-critico',t:c.title||'Criativo',c:c.clientId,due:c.statusAt||t0,late:!!c.statusAt&&daysTo(c.statusAt)<=-2,act:['open-creative',c.id],extra:c.format}));
 S.meetings.filter(m=>(m.memberIds||[]).includes(mm.id)&&parseD(m.when)&&ymd(parseD(m.when))===t0).forEach(m=>{const d=parseD(m.when);out.push({k:'Reunião',cls:'',t:m.title||m.kind,c:m.clientId,due:t0,time:pad(d.getHours())+':'+pad(d.getMinutes()),late:false,past:d<new Date(),act:['edit-meeting',m.id]})});
 return out.sort((a,b)=>(b.late-a.late)||(b.urg?1:0)-(a.urg?1:0)||(a.due||'').localeCompare(b.due||'')||(a.time||'99').localeCompare(b.time||'99'))}
function todayBlock(mm){const d=new Date();const L=todayItems(mm);const late=L.filter(x=>x.late).length;
 const when=x=>{if(x.k==='Ajuste de criativo'){const n=x.due?Math.max(0,-daysTo(x.due)):0;return `<b class="${n>=2?'late':''}">${n?'Pedido há '+n+' dia'+(n>1?'s':''):'Pedido hoje'}</b><small>refazer e reenviar</small>`}if(x.late){const n=-daysTo(x.due);return `<b class="late">Atrasado ${n} dia${n>1?'s':''}</b><small>prazo ${fD(x.due)}</small>`}return `<b>${x.k==='Reunião'?'Hoje às '+x.time:'Hoje'+(x.time?' até '+x.time:'')}</b><small>${fD(x.due)}/${x.due.slice(0,4)}</small>`};
 return `<section class="today"><div class="today-h"><div><div class="today-k">Hoje</div><h1>${WDF[d.getDay()].replace(/^./,c=>c.toUpperCase())}, ${d.getDate()} de ${MN[d.getMonth()]} de ${d.getFullYear()}</h1></div>
  <div class="today-sum"><span><b class="num">${L.length}</b> para hoje</span>${late?`<span class="late"><b class="num">${late}</b> atrasado${late>1?'s':''}</span>`:''}</div></div>
 ${L.length?`<div class="today-list">${L.map(x=>`<button class="today-i ${x.late?'is-late':''} ${x.past?'is-past':''}" data-act="${x.act[0]}" data-id="${esc(x.act[1])}" ${x.act[2]?`data-v="${esc(x.act[2])}"`:''}>
  <span class="today-t"><span class="row" style="gap:6px"><span class="pill ${x.cls}">${x.k}</span>${x.urg?'<span class="pill p-critico">URGENTE</span>':''}${x.extra&&x.extra!=='Aberto'&&x.extra!=='Pendente'?`<span class="pill">${esc(x.extra)}</span>`:''}</span><b>${esc(x.t)}</b></span>
  <span class="today-c">${x.c?clientLogo(x.c,34):''}<span style="min-width:0"><small>Cliente</small><b>${esc(x.c?cName(x.c):'Interno')}</b></span></span>
  <span class="today-d">${when(x)}</span></button>`).join('')}</div>`:`<p class="today-empty">Nada com prazo para hoje.</p>`}
 ${(()=>{const t0=today();const nx=openTasks(t=>t.assigneeId===mm.id&&!(t.due&&t.due<=t0));const doneT=S.todos.filter(t=>t.assigneeId===mm.id&&t.status==='Concluída'&&t.doneAt===t0).length;
  return `<div class="today-sub"><div class="today-sh"><b>Minhas próximas tarefas</b><small>${nx.length} aberta${nx.length===1?'':'s'}${doneT?` · ${doneT} concluída${doneT>1?'s':''} hoje`:''}</small><span style="flex:1"></span><button class="tb" data-act="task-new">+ Tarefa</button>${S.todos.some(t=>t.assigneeId===mm.id)?'<button class="tb" data-act="task-all">Ver todas</button>':''}</div>
  ${nx.length?`<div class="today-list">${nx.slice(0,10).map(t=>{const st=taskState(t);const n=t.due?daysTo(t.due):null;return `<div class="today-i ${st==='warn'?'is-warn':''}"><button class="ck" role="checkbox" aria-checked="false" data-act="task-done" data-id="${t.id}" aria-label="Concluir tarefa"></button>
   <button class="today-t" data-act="task-open" data-id="${t.id}" style="background:none;border:0;padding:0;color:inherit;text-align:left"><span class="row" style="gap:6px">${t.urgent?'<span class="pill p-critico">URGENTE</span>':''}${tkS(t)!=='Aberto'?`<span class="pill ${TK_CLS[tkS(t)]||''}">${esc(tkS(t))}</span>`:''}</span><b>${esc(t.title)}</b></button>
   <span class="today-c">${t.clientId?clientLogo(t.clientId,34):''}<span style="min-width:0"><small>Cliente</small><b>${esc(t.clientId?cName(t.clientId):'Interno')}</b></span></span>
   <span class="today-d"><b class="${st==='warn'?'warn':''}">${n===null?'Sem prazo':n===1?'Amanhã':n===2?'Em 2 dias':'Em '+n+' dias'}</b><small>${t.due?fD(t.due)+'/'+t.due.slice(0,4)+(t.dueTime?' · '+t.dueTime:''):'—'}</small></span></div>`}).join('')}</div>${nx.length>10?`<p class="today-empty">E mais ${nx.length-10}. Veja todas na aba Tarefas.</p>`:''}`:'<p class="today-empty">Nenhuma outra tarefa aberta com você.</p>'}</div>`})()}</section>`}

/* ---------- tarefas ---------- */
const TK_STATUS=['Aberto','Em execução','Em andamento','Em espera','Aguardando cliente','Aguardando aprovação','Aprovado','Concluída'];
const TK_CLS={'Aberto':'','Em execução':'p-acc','Em andamento':'p-medio','Em espera':'p-baixo','Aguardando cliente':'p-alto','Aguardando aprovação':'p-alto','Aprovado':'p-ok','Concluída':'p-ok','abertas':'p-critico'};
const TK_HINT={'Aberto':'pendente, ainda não começou','Em execução':'sendo feita agora','Em andamento':'começou, mas parada no momento','Em espera':'travada por algum motivo','Aguardando cliente':'parada esperando algo do cliente','Aguardando aprovação':'enviada para aprovar','Aprovado':'aprovada, falta entregar'};
const tkS=t=>({'A fazer':'Aberto','Fazendo':'Em andamento'}[t.status]||t.status||'Aberto');
const TK_TIPOS=['Banner','Outdoor','Encarte','Apresentação','Demanda extra','Calendário','Busdoor','Captação','Cardápio','Uniforme','Relatório','Demanda pós-horário','Reunião','Não se aplica'];
const TK_CATS=['Edição de foto','Edição de vídeo','Captação de foto','Captação de vídeo','Arte','Não se aplica'];
const TK_SUBS=['Feed','Stories','Feed e stories','Reels','Site','Não se aplica'];
const fOpen=iso=>{const d=iso?new Date(iso):null;return d&&!isNaN(d)?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' às '+pad(d.getHours())+':'+pad(d.getMinutes()):'—'};
function taskState(t){if(t.status==='Concluída')return'done';if(!t.due)return'ok';let n=daysTo(t.due);
 if(n===0&&t.dueTime){const[h,mi]=t.dueTime.split(':').map(Number);const lim=new Date();lim.setHours(h,mi,0,0);if(new Date()>lim)return'late'}
 if(n<0)return'late';if(n<=2)return'warn';return'ok'}
function taskWhen(t){if(t.status==='Concluída')return'concluída '+fD(t.doneAt);if(!t.due)return'sem prazo';const n=daysTo(t.due);const tm=t.dueTime?' às '+t.dueTime:'';
 if(taskState(t)==='late')return n<0?'atrasada há '+(-n)+' dia'+(n===-1?'':'s'):'venceu hoje'+tm;if(n===0)return'vence hoje'+tm;if(n===1)return'vence amanhã'+tm;if(n===2)return'vence em 2 dias';return'prazo '+fD(t.due)+tm}
const canManageTask=t=>isAdmin()||(t&&me.id&&t.createdBy===me.id);
const canWorkTask=t=>canManageTask(t)||(t&&myMember()&&t.assigneeId===myMember().id);
function openTasks(filter){return S.todos.filter(t=>t.status!=='Concluída'&&(!filter||filter(t))).sort((a,b)=>{const r={late:0,warn:1,ok:2};return (!!b.urgent-!!a.urgent)||r[taskState(a)]-r[taskState(b)]||(a.due||'9').localeCompare(b.due||'9')||(PRANK[a.priority]??2)-(PRANK[b.priority]??2)})}
function taskRow(t,showWho){const st=taskState(t);return `<div class="task t-${st}"><button class="ck" role="checkbox" aria-checked="${t.status==='Concluída'}" data-act="task-done" data-id="${t.id}" aria-label="Concluir tarefa" ${canWorkTask(t)?'':'disabled'}>${t.status==='Concluída'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>':''}</button>
 <button class="tk-main" data-act="task-open" data-id="${t.id}"><span class="t">${t.urgent?'<span class="pill p-critico" style="margin-right:6px">URGENTE</span>':''}${esc(t.title)}</span><span class="m">${[t.tipo,t.categoria,t.subcategoria].filter(x=>x&&x!=='Não se aplica').length?`<span>${esc([t.tipo,t.categoria,t.subcategoria].filter(x=>x&&x!=='Não se aplica').join(' · '))}${t.qtd>1?' · '+t.qtd+' un.':''}</span>`:''}${t.nivel?`<span class="pill">Nível ${esc(t.nivel)}</span>`:''}${showWho?`<span class="row" style="gap:6px;flex-wrap:nowrap">${av(t.assigneeId)}${esc(mName(t.assigneeId))}</span>`:''}${t.clientId?`<span>${esc(cName(t.clientId))}</span>`:''}${t.status!=='Concluída'&&tkS(t)!=='Aberto'?`<span class="pill ${TK_CLS[tkS(t)]||''}">${tkS(t)==='Em execução'?'● ':''}${esc(tkS(t))}</span>`:''}${(t.comments||[]).length?`<span>💬 ${t.comments.length}</span>`:''}</span></button>
 <span class="tk-when">${prioPill(t.priority)}<b>${esc(taskWhen(t))}</b></span></div>`}
function tasksPanel(title,list,showWho,empty){const late=list.filter(t=>taskState(t)==='late').length,warn=list.filter(t=>taskState(t)==='warn').length;
 return `<section class="panel"><h2>${title} <span class="sub">${list.length} aberta${list.length===1?'':'s'}${late?` · <b style="color:var(--crit)">${late} atrasada${late>1?'s':''}</b>`:''}${warn?` · <b style="color:var(--high)">${warn} perto do prazo</b>`:''}</span></h2>
 <div class="tasks">${list.length?list.slice(0,12).map(t=>taskRow(t,showWho)).join(''):emptyBox(empty[0],empty[1])}</div>

 formModal({title:isNew?(files?(multi?`Enviar ${files.length} arquivos`:'Enviar arquivo'):'Adicionar link'):'Editar criativo',values:c,fields,

     await put('creatives',uid(),rec);ok++}
    catch(e){const m={too_large:'é maior que 20 MB',unsupported_type:'tem um formato não aceito',quota_or_state:'não coube: o espaço da biblioteca acabou',rate_limited:'não foi enviado: muitos envios seguidos, tente em instantes',not_granted:'não foi enviado: seu acesso não permite upload'}[e?.code]||'não foi enviado';toast(`“${f.name}” ${m}.`);await new Promise(r=>setTimeout(r,1800))}}
   if(ok)sysPost(`**${actor()}** subiu ${ok>1?ok+' criativos':'o criativo **'+(multi?files[0].name:v.title)+'**'}${v.clientId?' de **'+cName(v.clientId)+'**':''} na biblioteca`,{act:'nav',id:'',v:'criativos'});
   if(ok)toast(ok===files.length?(ok>1?ok+' criativos enviados':'Criativo enviado'):`${ok} de ${files.length} enviados`);if(!ok)throw new Error('none')},

async function removeCreative(c){if(c.assetId){if(!assets){toast('Só quem enviou o arquivo ou um editor do CRM pode excluí-lo.');throw new Error('perm')}

function pickFiles(list){const files=[...list];const bad=files.filter(f=>!CR_TYPES[f.type]||f.size>20*1048576);const good=files.filter(f=>!bad.includes(f));
 if(bad.length)toast(bad.length===1?`“${bad[0].name}” não pode ser enviado (formato ou tamanho). Use “Adicionar link”.`:`${bad.length} arquivos ficaram de fora (formato ou tamanho acima de 20 MB).`);
 if(good.length)creativeForm(null,good)}
$('#cr-file').addEventListener('change',e=>{if(e.target.files.length)pickFiles(e.target.files);e.target.value=''});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('on')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('on')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.remove('on');if(!assets)return;if(e.dataTransfer?.files?.length)pickFiles(e.dataTransfer.files)});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.avfb){const s=document.createElement('span');s.className='av';s.style.cssText=t.style.cssText;s.style.background=t.dataset.avc;s.textContent=t.dataset.avfb;t.replaceWith(s);return}if(t&&t.tagName==='IMG'&&t.dataset.fb){const s=document.createElement('span');s.className='ph';s.textContent='Arquivo indisponível';t.replaceWith(s)}},true);

let modalCtx=null;
function openModal(html,ctx){$('#modal').innerHTML=html;$('#mwrap').hidden=false;modalCtx=ctx||{};const f=$('#modal input,#modal select,#modal textarea');if(f&&window.innerWidth>820&&html)f.focus()}
function closeModal(){const back=modalCtx?.back;$('#mwrap').hidden=true;$('#modal').innerHTML='';modalCtx=null;if(back)back()}
const opt=(arr,v,empty)=>(empty!==undefined?`<option value="">${empty}</option>`:'')+arr.map(o=>{const val=typeof o==='string'?o:o.v,l=typeof o==='string'?o:o.l;return `<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(l)}</option>`}).join('');
function fld(f,v){const id='f_'+f.k,cls='fld'+(f.full?' full':''),hint=f.hint?`<small>${esc(f.hint)}</small>`:'';
 if(f.t==='select')return `<label class="${cls}"><span>${f.l}</span><select id="${id}">${opt(f.o,v,f.empty)}</select>${hint}</label>`;
 if(f.t==='textarea')return `<label class="${cls}"><span>${f.l}</span><textarea id="${id}" placeholder="${esc(f.ph||'')}" ${f.rows?`style="min-height:${f.rows*22}px"`:''}>${esc(v)}</textarea>${hint}</label>`;
 if(f.t==='chips')return `<div class="${cls}"><span>${f.l}</span><div class="chips" id="${id}">${f.o.map(o=>`<button type="button" class="chip obj" data-act="chip" data-v="${esc(o.v)}" aria-pressed="${(v||[]).includes(o.v)}">${esc(o.l)}</button>`).join('')||'<small style="color:var(--muted)">Nada para escolher ainda.</small>'}</div></div>`;
 return `<label class="${cls}"><span>${f.l}</span><input id="${id}" type="${f.t||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.t==='number'?'min="0" step="any" inputmode="decimal"':''} ${f.list?`list="${id}-dl"`:''}>${f.list?`<datalist id="${id}-dl">${[...new Set(f.list)].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`:''}${hint}</label>`}
function formModal({title,fields,values={},onSave,onDelete,delLabel='Remover',back}){
 openModal(`<form id="mform"><div class="mh"><h2>${esc(title)}</h2><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div>
 <div class="mb"><div class="fgrid">${fields.map(f=>fld(f,values[f.k])).join('')}</div></div>
 <div class="mf">${onDelete?`<button type="button" class="btn danger" data-act="mdel">${delLabel}</button>`:''}<span class="spacer"></span><button type="button" class="btn" data-act="close">${back?'Voltar':'Cancelar'}</button><button type="submit" class="btn primary">Salvar</button></div></form>`,{fields,onSave,onDelete,delLabel,back})}
function readForm(fields){const o={};for(const f of fields){const n=document.getElementById('f_'+f.k);if(!n)continue;o[f.k]=f.t==='chips'?[...n.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.v):n.value.trim()}return o}
document.addEventListener('submit',async e=>{if(e.target.id==='cw-form'){e.preventDefault();await cwSend();return}if(e.target.id==='chat-form'){e.preventDefault();await chatSend();return}if(e.target.id!=='mform')return;e.preventDefault();const c=modalCtx;if(!c?.onSave)return;
 const v=readForm(c.fields);const miss=c.fields.find(f=>f.req&&!v[f.k]);if(miss){toast(`Preencha “${miss.l}”.`);document.getElementById('f_'+miss.k)?.focus();return}
 try{await c.onSave(v);closeModal()}catch(err){}});

function go(v){ui.view=v;try{localStorage.setItem('crm-ui-view',v)}catch(x){}refresh();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
 try{switch(a){
 case'nav':modalCtx=null;$('#mwrap').hidden=true;if(v==='onboarding')ui.svc=null;go(v);break;
 case'close':closeModal();break;
 case'chip':b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');break;
 case'mdel':if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar: '+(modalCtx?.delLabel||'Remover').toLowerCase();return}
  {const c=modalCtx;await c.onDelete();if(c.back)c.back=null;closeModal()}break;
 case'f-prio':ui.prio=v;refresh();break;
 case'ctab':ui.ctab=v;refresh();break;
 case'agtab':ui.agTab=v;refresh();break;
 case'ptab':ui.pTab=v;refresh();break;
 case'obtab':ui.obTab=v;refresh();break;
 case'go-wait':ui.cTab='relac';go('clientes');break;
 case'new-client':clientForm();break;
 case'open-client':clientDetail(id);break;
 case'edit-client':clientForm(byId('clients',id));break;
 case'cl-stage':await setStage(id,v);break;
 case'cl-sat':{const c=byId('clients',id);await put('clients',id,{...c,satisfaction:+c.satisfaction===+v?0:+v});break}
 case'cl-obj':{const c=byId('clients',id);let o=[...(c.objectives||[])];o=o.includes(v)?o.filter(x=>x!==v):[...o,v];const prim=o.includes(c.primaryObjective)?c.primaryObjective:(o[0]||'');
  const hist=[...(c.objHistory||[])];const last=hist[hist.length-1];const entry={at:today(),primary:prim,objectives:o};if(last&&last.at===today())hist[hist.length-1]=entry;else hist.push(entry);
  await put('clients',id,{...c,objectives:o,primaryObjective:prim,objHistory:hist.slice(-20)});break}
 case'note-add':{const t=$('#note-text').value.trim();if(!t){toast('Escreva a observação primeiro.');return}const c=byId('clients',id);$('#note-text').value='';
  await put('clients',id,{...c,notes:[...(c.notes||[]),{id:uid(),text:t,at:today(),...(me.id?{by:me.id}:{})}]});toast('Observação salva');break}
 case'note-del':{const c=byId('clients',id);await put('clients',id,{...c,notes:(c.notes||[]).filter(n=>n.id!==v)});break}
 case'cl-catalog':ui.catClient=id;modalCtx=null;$('#mwrap').hidden=true;go('catalogo');break;
 case'open-onboarding':onboardingSheet(id);break;
 case'ob-start':await saveOb(id,ob=>{ob.startedAt=today()});toast('Onboarding iniciado');break;
 case'ob-check':await saveOb(id,ob=>{ob.checklist=ob.checklist||{};const cur=ob.checklist[v];ob.checklist[v]=cur?.done?{done:false}:{done:true,at:today()};if(!ob.startedAt)ob.startedAt=today()});break;
 case'ob-svc':await saveOb(id,ob=>{const s=ob.services||[];ob.services=s.includes(v)?s.filter(x=>x!==v):[...s,v]});break;

 return out.map(w=>({...w,days:Math.max(0,daysSince(w.since)||0)})).sort((a,b)=>b.days-a.days)}
function waitRow(w){const c=w.days>7?'critico':w.days>3?'alto':'medio';return `<button class="item" data-act="${w.tid?'task-open':'open-onboarding'}" data-id="${w.tid||w.cid}"><span class="stripe s-${c}"></span>

 <span class="r"><span class="pill p-${c}"><span class="num">${w.days}</span> dia${w.days===1?'':'s'}</span><span class="when">desde ${fD(w.since)}</span></span></button>`}
const resOf=cid=>S.results.filter(r=>r.clientId===cid).sort((a,b)=>(b.month||'').localeCompare(a.month||''));
function health(c){if(c.stage!=='Fechado')return null;let s=100;const why=[];
 const ts=S.todos.filter(t=>t.clientId===c.id&&tkOpen(t));
 const late=ts.filter(t=>tkS(t)!=='Aguardando cliente'&&taskState(t)==='late').length;
 if(late){s-=Math.min(45,late*15);why.push(late+' tarefa'+(late>1?'s':'')+' atrasada'+(late>1?'s':''))}
 const w=ts.filter(t=>tkS(t)==='Aguardando cliente'&&(daysSince(t.waitingSince)||0)>5).length;
 if(w){s-=Math.min(30,w*10);why.push(w+' item'+(w>1?'s':'')+' parado'+(w>1?'s':'')+' com o cliente há mais de 5 dias')}
 const past=lastContact(c);const ds=past?daysSince(past):daysSince(c.closedAt||c.createdAt);
 if(ds!==null&&ds>60){s-=25;why.push(past?'último contato há '+ds+' dias':'nenhum contato registrado')}else if(ds!==null&&ds>30){s-=15;why.push(past?'último contato há '+ds+' dias':'nenhum contato registrado')}
 const sat=+c.satisfaction||0;const pen={1:40,2:30,3:15,4:5}[sat]||0;if(pen){s-=pen;why.push('satisfação '+sat+'/5')}
 const ob=c.onboarding;if(c.closedAt&&daysSince(c.closedAt)>30){const done=CHECK.filter(i=>ob?.checklist?.[i.id]?.done).length;if(done<CHECK.length){s-=10;why.push('onboarding incompleto ('+done+'/'+CHECK.length+')')}}
 const ce=daysTo(c.contractEnd);if(ce!==null&&ce<=30){s-=10;why.push(ce<0?'contrato vencido há '+(-ce)+' dias':'contrato vence em '+ce+' dias')}
 if(c.closedAt&&daysSince(c.closedAt)>45&&!resOf(c.id).some(r=>r.month>=shiftMonth(thisMonth(),-2))){s-=5;why.push('sem resultados registrados nos últimos meses')}
 s=Math.max(0,Math.min(100,s));const lv=s>=75?['ok','Saudável']:s>=50?['warn','Atenção']:['risk','Em risco'];
 return{score:s,lv:lv[0],label:lv[1],why}}
function relOwner(c){const rel=S.members.find(m=>m.area==='Relacionamento')?.id||'';if(c?.relId&&byId('members',c.relId))return c.relId;if(c?.stage==='Fechado'&&rel)return rel;if(c?.ownerId&&byId('members',c.ownerId))return c.ownerId;return rel}
function memberStats(id){const mine=S.todos.filter(t=>t.assigneeId===id);const open=mine.filter(tkOpen);const done=mine.filter(t=>!tkOpen(t));
 const late=open.filter(t=>taskState(t)==='late');const ontime=done.filter(t=>!t.due||(t.doneAt||'')<=t.due);
 const mo=thisMonth();const cat=S.catalog.filter(c=>c.month===mo).flatMap(c=>c.items||[]).filter(i=>i.assigneeId===id);
 return{open:open.length,done:done.length,late:late.length,rate:done.length?Math.round(ontime.length/done.length*100):null,catTotal:cat.length,catDone:cat.filter(i=>i.status==='Publicado').length,
  meet:S.meetings.filter(x=>(x.memberIds||[]).includes(id)&&parseD(x.when)>new Date()).length,clients:S.clients.filter(c=>c.stage==='Fechado'&&relOwner(c)===id).length,projects:S.projects.filter(p=>p.ownerId===id&&!projDone(p)).length}}

 S.campaigns.filter(c=>c.status!=='Encerrada'&&(c.date||'9')>=lim).forEach(c=>{const p=c.projectId&&byId('projects',c.projectId);let stage,resp,due,state='';

  else{stage='Campanha: '+c.status;resp=c.ownerId;due=c.prepStart&&c.prepStart>now?c.prepStart:c.date}

 return rows}

 const rows=people.map(m=>{const c=cap(m),w0=weekLoad(m.id,0),w1=weekLoad(m.id,1);const open=S.todos.filter(t=>t.assigneeId===m.id&&tkOpen(t));const late=open.filter(t=>taskState(t)==='late').reduce((s,t)=>s+pts(t),0);return{m,c,w0,w1,late,open:open.length}}).sort((a,b)=>b.w0/b.c-a.w0/a.c);
 const tc=rows.reduce((s,r)=>s+r.c,0),tl=rows.reduce((s,r)=>s+r.w0,0);const over=rows.filter(r=>r.w0>r.c);const free=rows.filter(r=>r.w0<r.c*.5);
 const bar=(l,c)=>`<span class="row" style="flex-wrap:nowrap;gap:8px"><span class="capbar ${capCls(l,c)}" style="flex:1"><i style="width:${Math.min(100,l/Math.max(1,c)*100)}%"></i></span><b class="num" style="white-space:nowrap">${l}/${c}</b></span>`;
 return `<div class="kpis"><div class="kpi ${tl>tc?'alert':''}"><div class="l">Carga da equipe nesta semana</div><div class="v">${tc?Math.round(tl/tc*100):0}%</div><div class="s">${tl} de ${tc} pontos</div></div>
  <div class="kpi ${over.length?'alert':''}"><div class="l">Acima da capacidade</div><div class="v">${over.length}</div><div class="s">${over.map(r=>esc(r.m.name.split(' ')[0])).join(', ')||'ninguém'}</div></div>
  <div class="kpi"><div class="l">Com folga</div><div class="v">${free.length}</div><div class="s">${free.map(r=>esc(r.m.name.split(' ')[0])).join(', ')||'ninguém'}</div></div>
  <div class="kpi"><div class="l">Semana</div><div class="v" style="font-size:20px">${fD(weekStart(0))} a ${fD(weekEnd(0))}</div><div class="s">segunda a domingo</div></div></div>
 <section class="panel" style="padding:8px"><div class="tbl-wrap"><table><thead><tr><th>Integrante</th><th style="min-width:200px">Esta semana</th><th style="min-width:200px">Próxima semana</th><th>Pontos atrasados</th><th>Tarefas abertas</th></tr></thead><tbody>
 ${rows.map(r=>`<tr class="click" data-act="tk-who" data-id="${r.m.id}"><td style="white-space:nowrap"><span class="row" style="flex-wrap:nowrap;gap:8px">${av(r.m.id)}<span>${esc(r.m.name)}<br><small style="color:var(--muted)">${esc(r.m.area)}</small></span></span></td><td>${bar(r.w0,r.c)}</td><td>${bar(r.w1,r.c)}</td><td class="num" style="${r.late?'color:var(--crit);font-weight:700':'color:var(--muted)'}">${r.late}</td><td class="num">${r.open}</td></tr>`).join('')||`<tr><td colspan="5">${emptyBox('Sem integrantes','')}</td></tr>`}
 </tbody></table></div></section>
 <section class="panel"><h2>Como a capacidade é calculada</h2><div style="font-size:14px;display:flex;flex-direction:column;gap:6px;max-width:76ch;color:var(--muted)">
  <p style="margin:0">Cada tarefa vale o seu nível em pontos: Nível 1 = 1 ponto, Nível 2 = 2, Nível 3 = 3. Etapas de projeto entram com Nível 2 por padrão e podem ser ajustadas.</p>
  <p style="margin:0">“Esta semana” soma as tarefas abertas com prazo até domingo, as atrasadas e as sem prazo. “Próxima semana” soma as que vencem na semana seguinte.</p>

  {k:'notes',l:'O que aconteceu',t:'textarea',full:1,ph:'Resumo da conversa, objeções, próximo passo combinado'}],
  onSave:async v=>{await put('follows',id,{...f,...v,status:'Feito',doneAt:today(),doneBy:me.id||'',doneMember:myMember()?.id||''});
   let cur=byId('clients',c.id);const stop=v.result==='Respondeu e avançou'||v.result==='Não tem interesse'||!!v.back;
   if(stop)await cancelCadence(c.id);
   if(v.back)await put('follows',`cad-${c.id}-r${Date.now().toString(36)}`,{clientId:c.id,type:'Cadência comercial',step:'R',dueFrom:v.back,dueTo:ymd(addD(parseD(v.back),1)),ownerId:f.ownerId,status:'Pendente',createdAt:today(),source:{kind:'cadence',id:c.id+'-r'+Date.now(),label:'Retorno combinado'},goal:'Retorno pedido pelo lead'+(v.notes?': '+v.notes:'')});
   cur={...cur,lastTouch:today()};if(v.notes)cur.notes=[...(cur.notes||[]),{id:uid(),text:(f.step==='R'?'Retorno':'Cadência D+'+f.step)+' ('+v.channel+', '+v.result.toLowerCase()+'): '+v.notes,at:today(),...(me.id?{by:me.id}:{})}];
   const mv=v.move||(v.result==='Não tem interesse'?'Perdido':'');
   if(mv==='Perdido'){await put('clients',c.id,stageFix(c,{...cur,stage:'Perdido',lostReason:cur.lostReason||'Sem interesse'}));await cancelCadence(c.id)}
   else if(mv)await put('clients',c.id,stageFix(c,{...cur,stage:mv}));else await put('clients',c.id,cur);
   toast('Contato registrado'+(mv?' · lead em '+mv:'')+(stop&&!mv?' · cadência encerrada':''))}});
 const mb=$('#modal .mb');if(mb)mb.insertAdjacentHTML('afterbegin',`<div class="note"><p><b>${esc(f.goal||'Contato de cadência')}</b>${c.contact?'<br>'+esc(c.contact)+(c.phone?' · '+esc(c.phone):''):''}</p></div>`);
 const mf=$('#modal .mf');if(mf)mf.insertAdjacentHTML('afterbegin',`<button type="button" class="btn ghost" data-act="open-client" data-id="${c.id}">Ficha do lead</button>`)}
function stageFix(c,rec){const was=c.stage,now=rec.stage;if(was!==now)rec.stageAt=today();
 if(now==='Fechado'&&was!=='Fechado'){rec.closedAt=today();rec.onboarding={...(c.onboarding||{}),startedAt:c.onboarding?.startedAt||today()};delete rec.lostAt;delete rec.churnedAt}
 if(was==='Fechado'&&now!=='Fechado'){if(now==='Perdido')rec.churnedAt=today();else{delete rec.closedAt;const ob={...(rec.onboarding||{})};if(!CHECK.some(i=>ob.checklist?.[i.id]?.done)){delete ob.startedAt;rec.onboarding=ob}}}
 if(now==='Perdido'&&was!=='Perdido'&&was!=='Fechado')rec.lostAt=today();
 if(was==='Perdido'&&now!=='Perdido'){delete rec.lostAt;delete rec.churnedAt}
 return rec}

function convStats(list,from){const inP=d=>d&&(!from||d>=from);const novos=list.filter(c=>inP(c.createdAt)).length;const fech=list.filter(c=>c.closedAt&&inP(c.closedAt)&&(c.stage==='Fechado'||c.churnedAt));const perd=list.filter(c=>c.lostAt&&inP(c.lostAt));
 const mrr=fech.reduce((s,c)=>s+(+c.value||0),0);const cyc=fech.map(c=>c.createdAt&&c.closedAt?Math.max(0,Math.round((parseD(c.closedAt)-parseD(c.createdAt))/864e5)):null).filter(x=>x!==null);
 return{novos,fech:fech.length,perd:perd.length,conv:fech.length+perd.length?Math.round(fech.length/(fech.length+perd.length)*100):null,mrr,ticket:fech.length?mrr/fech.length:0,ciclo:cyc.length?Math.round(cyc.reduce((a,b)=>a+b,0)/cyc.length):null}}

   <p style="font-size:13px;color:var(--muted);margin:8px 0 0">${h.why.length?esc(h.why.join(' · ')):'Sem pontos de atenção.'}</p></div>`:''}

  ${closed||ob.startedAt?`<div class="sec"><h3>Onboarding</h3><div class="row" style="flex-wrap:nowrap"><span class="bar ok" style="flex:1"><i style="width:${obDone/CHECK.length*100}%"></i></span><span class="num" style="font-size:13px">${obDone}/${CHECK.length}</span><button class="btn sm" data-act="open-onboarding" data-id="${id}">Abrir checklist</button></div></div>`:''}
  <div class="sec"><h3>Arquivos do cliente</h3>${c.folderUrl||c.uploadUrl?`<div class="row">${c.folderUrl?`<a class="btn sm" href="${esc(c.folderUrl)}" target="_blank" rel="noopener">📁 Abrir pasta do cliente ↗</a>`:''}${c.uploadUrl?`<button class="btn sm" data-act="cl-copy-up" data-id="${id}">Copiar link de envio</button>`:''}<button class="btn sm primary" data-act="cl-received" data-id="${id}">Material recebido</button></div>
   ${c.uploadUrl?`<p style="margin:8px 0 0;font-size:12.5px;color:var(--muted)">Link de envio: <span style="user-select:all;overflow-wrap:anywhere">${esc(c.uploadUrl)}</span></p>`:''}${c.lastReceived?`<p style="margin:4px 0 0;font-size:12.5px;color:var(--muted)">Último material recebido em ${fD(c.lastReceived)}</p>`:''}`
   :`<div class="note" style="align-items:center"><p>Cadastre a pasta e o link de envio do cliente para o time achar tudo num lugar só.</p><button class="btn sm" data-act="edit-client" data-id="${id}">Cadastrar</button></div>`}</div>
  <div class="sec"><h3>Necessidade de marketing agora</h3>
