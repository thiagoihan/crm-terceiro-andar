   <div class="list" style="gap:6px;margin-top:8px">${notes.map(n=>`<div class="note"><div><p>${esc(n.text)}</p><small>${fD(n.at)}/${esc((n.at||'').slice(0,4))}${n.by?' · '+esc(who(n.by)):''}</small></div><button class="x" data-act="note-del" data-id="${id}" data-v="${n.id}" aria-label="Apagar observação">×</button></div>`).join('')}</div></div>
  ${!lead||ps.length?`<div class="sec"><h3>Projetos (${ps.length})</h3><div class="list">${ps.map(p=>`<button class="item" data-act="open-project" data-id="${p.id}"><span class="stripe s-${p.priority||'medio'}"></span><span><span class="t">${esc(p.title)}</span><span class="m"><span>${progress(p)}% concluído</span>${curStage(p)?'<span>Agora: '+esc(curStage(p).title)+'</span>':''}${projDone(p)?'<span>Concluído</span>':''}</span></span><span class="r">${prioPill(p.priority)}</span></button>`).join('')||'<small style="color:var(--muted)">Nenhum projeto.</small>'}</div>
   <button class="btn sm" style="margin-top:6px" data-act="new-project" data-client="${id}">+ Projeto para este cliente</button></div>`:''}
  ${aps.length?`<div class="sec"><h3>Aprovações registradas (${aps.length})</h3><div class="list">${aps.slice(0,6).map(a=>`<button class="item" data-act="${a.act[0]}" data-id="${a.act[1]}"><span class="stripe s-ok"></span><span><span class="t">${esc(a.what)}</span><span class="m"><span>${esc(a.by)}</span><span>${esc(a.channel)}</span>${a.link?'<span>com prova</span>':''}</span></span><span class="r"><span class="when">${fD(a.at)}</span></span></button>`).join('')}</div></div>`:''}
  ${(()=>{const cr=S.creatives.filter(x=>x.clientId===id).sort((a,b)=>(b.ts||0)-(a.ts||0));return cr.length||!lead?`<div class="sec"><h3>Criativos (${cr.length})</h3>${cr.length?`<div class="mini">${cr.slice(0,8).map(x=>`<button data-act="open-creative" data-id="${x.id}" title="${esc(x.title)}">${crKind(x)==='img'?`<img src="${esc(crUrl(x))}" alt="" loading="lazy" data-fb="1">`:kindLabel[crKind(x)]}</button>`).join('')}</div><button class="btn sm" style="margin-top:6px" data-act="cr-client" data-id="${id}">Ver todos na biblioteca</button>`:'<small style="color:var(--muted)">Nenhum criativo ainda.</small>'}</div>`:''})()}
  <div class="sec"><h3>Reuniões</h3><div class="list">${ms.map(meetingRow).join('')||'<small style="color:var(--muted)">Nenhuma reunião.</small>'}</div>
   <button class="btn sm" style="margin-top:6px" data-act="new-meeting" data-client="${id}">+ Reunião com este cliente</button></div>
  ${(()=>{if(lead)return'';const cps=S.campaigns.filter(x=>x.clientId===id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));const from=today();
   const sug=DT_YEARS.flatMap(y=>allDatesYear(y)).filter(d=>d.date>=from&&relevantTo(d,c)&&!cps.some(x=>x.dateKey===d.key)).slice(0,4);
   return `<div class="sec"><h3>Campanhas em datas comemorativas (${cps.length})</h3><div class="list">${cps.map(x=>`<button class="item" data-act="cp-open" data-id="${x.id}"><span class="stripe s-medio"></span><span><span class="t">${esc(x.name)}</span><span class="m"><span>${esc(x.dateName)}</span><span>${fD(x.date)}/${(x.date||'').slice(2,4)}</span></span></span><span class="r"><span class="pill ${CP_CLS[x.status]||''}">${esc(x.status)}</span></span></button>`).join('')||'<small style="color:var(--muted)">Nenhuma campanha ainda.</small>'}</div>
   ${sug.length?`<p style="font-size:13px;margin:8px 0 4px;color:var(--muted)">Datas que combinam com o segmento${c.segment?' “'+esc(c.segment)+'”':''}:</p><div class="row">${sug.map(d=>`<button class="btn sm" data-act="cp-new" data-client="${id}" data-v="${esc(d.key)}">+ ${esc(d.name)} · ${fD(d.date)}/${d.date.slice(2,4)}</button>`).join('')}</div>`:''}
   <button class="btn sm" style="margin-top:6px" data-act="dt-client" data-id="${id}">Ver calendário deste cliente</button></div>`})()}
  ${(()=>{const l=lastContact(c);const n=S.follows.filter(f=>f.clientId===id&&f.status!=='Feito'&&!isCad(f)).sort((a,b)=>(a.dueFrom||'').localeCompare(b.dueFrom||''))[0];return `<div class="sec"><h3>Relacionamento</h3><div class="row"><span class="pill">Último contato: ${l?fD(l)+' (há '+daysSince(l)+'d)':'nunca'}</span>${n?`<span class="pill ${fuState(n)==='late'?'p-critico':fuState(n)==='warn'?'p-alto':''}">Próximo follow-up: ${esc(fuWhen(n))}</span>`:''}${c.rel?.business?`<span class="pill">Negócio atualizado ${fD(c.rel.businessAt)}</span>`:''}</div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="fu-client" data-id="${id}">Histórico e ficha de relacionamento</button><button class="btn sm" data-act="fu-new" data-id="${id}">+ Follow-up</button>${!lead?`<button class="btn sm primary" data-act="inv-open" data-id="${id}">Convidar para devolutiva</button>`:''}${isAdmin()?`<button class="btn sm" data-act="task-new" data-client="${id}">+ Tarefa</button>`:''}</div></div>`})()}
  ${stamp(c)}
 </div>
 <div class="mf">${lead?'':`<button class="btn" data-act="cl-catalog" data-id="${id}">Ver catálogo</button>`}<span class="spacer"></span><button class="btn primary" data-act="edit-client" data-id="${id}">Editar</button></div>`};
 openModal('',{rerender:draw});draw()}

function clientCard(c){const nm=S.meetings.filter(m=>m.clientId===c.id&&parseD(m.when)>new Date()).sort((a,b)=>parseD(a.when)-parseD(b.when))[0];
 const op=S.projects.filter(p=>p.clientId===c.id&&!projDone(p)).length;const h=health(c);const ce=daysTo(c.contractEnd);
 const pill=c.stage==='Fechado'?'p-ok':c.stage==='Perdido'?'p-baixo':'p-acc';
 return `<button class="card" data-act="open-client" data-id="${c.id}"><div class="top"><span class="row" style="flex-wrap:nowrap;gap:10px;min-width:0">${clientLogo(c,38)}<h3>${esc(c.name)}</h3></span><span class="pill ${pill}">${esc(c.stage)}</span></div>
 ${h?`<div class="row" style="gap:6px">${healthTag(h)}${ce!==null&&ce<=60?`<span class="pill p-alto">${ce<0?'contrato vencido':'renova em '+ce+'d'}</span>`:''}</div>`:''}
 ${c.primaryObjective&&oName(c.primaryObjective)?`<div><span class="pill p-medio">Foco: ${esc(oName(c.primaryObjective))}</span></div>`:''}
 <div class="meta"><span>${esc(c.segment||'Sem segmento')}</span><span>${money(c.value)}/mês</span><span>${esc(mName(c.stage==='Fechado'?relOwner(c):c.ownerId))}</span></div>
 <div class="meta"><span>${op} projeto${op===1?'':'s'} em andamento</span><span>${nm?'Reunião '+fDT(nm.when):'Sem reunião marcada'}</span></div>
 ${c.stage==='Perdido'&&c.lostReason?`<div class="meta"><span>Motivo: ${esc(c.lostReason)}</span></div>`:''}</button>`}
function carteiraBody(){let list=S.clients.slice();const q=ui.q.trim().toLowerCase();const f=ui.cFilter||'ativos';
 const counts={ativos:S.clients.filter(c=>c.stage==='Fechado').length,leads:S.clients.filter(isLead).length,perdidos:S.clients.filter(c=>c.stage==='Perdido').length,todos:S.clients.length};
 if(f==='ativos')list=list.filter(c=>c.stage==='Fechado');if(f==='leads')list=list.filter(isLead);if(f==='perdidos')list=list.filter(c=>c.stage==='Perdido');
 if(q)list=list.filter(c=>[c.name,c.contact,c.segment].join(' ').toLowerCase().includes(q));
 list.sort((a,b)=>{const ha=health(a),hb=health(b);return (ha?ha.score:200)-(hb?hb.score:200)||String(a.name).localeCompare(b.name)});
 return `<div class="row" style="justify-content:space-between"><div class="chips">${[['ativos','Clientes ativos'],['leads','Leads'],['perdidos','Perdidos e ex-clientes'],['todos','Todos']].map(([k,l])=>`<button class="chip" data-act="c-filter" data-v="${k}" aria-pressed="${f===k}">${l} · ${counts[k]}</button>`).join('')}</div>
 <input class="search" id="q-clients" data-filter="q" placeholder="Buscar cliente, contato ou segmento" value="${esc(ui.q)}"></div>
 ${f==='leads'?'<p style="margin:0;font-size:13px;color:var(--muted)">O funil, a cadência e a conversão dos leads ficam na aba <button class="lnk" data-act="nav" data-v="comercial">Comercial</button>.</p>':''}
 ${list.length?`<div class="cards">${list.map(clientCard).join('')}</div>`:emptyBox(f==='ativos'?'Nenhum cliente ativo ainda':'Nenhum cliente nesta lista',f==='ativos'?'Quando um lead fechar negócio pela passagem de bastão, ele aparece aqui.':'')}`}
function relacBody(){const mm=myMember();let pend=S.follows.filter(f=>f.status!=='Feito'&&!isCad(f));if(ui.fuMine&&mm)pend=pend.filter(f=>fuOwns(f,mm.id));
 const r={late:0,warn:1,ok:2};pend.sort((a,b)=>r[fuState(a)]-r[fuState(b)]||(a.dueFrom||'').localeCompare(b.dueFrom||''));
 const late=pend.filter(f=>fuState(f)==='late').length,now=pend.filter(f=>fuState(f)==='warn').length;
 const act=S.clients.filter(c=>c.stage==='Fechado');const cold=act.filter(c=>{const l=lastContact(c);return !l||daysSince(l)>30});
 const wq=waiting();const ren=renewals(60);const rp=resultsPending();const pm=shiftMonth(thisMonth(),-1);
 const L=act.map(c=>({c,l:lastContact(c),n:S.follows.filter(f=>f.clientId===c.id&&f.status!=='Feito'&&!isCad(f)).sort((a,b)=>(a.dueFrom||'').localeCompare(b.dueFrom||''))[0]})).sort((a,b)=>(a.l||'0').localeCompare(b.l||'0'));
 return `<div class="kpis"><div class="kpi ${late?'alert':''}"><div class="l">Follow-ups atrasados</div><div class="v">${late}</div><div class="s">${now} para fazer agora</div></div>
  <div class="kpi ${wq.some(w=>w.days>7)?'alert':''}"><div class="l">Aguardando o cliente</div><div class="v">${wq.length}</div><div class="s">${wq.length?'mais antigo: '+wq[0].days+' dias':'nada parado'}</div></div>
  <div class="kpi ${ren.some(x=>x.n<=30)?'alert':''}"><div class="l">Renovações e reajustes</div><div class="v">${ren.length}</div><div class="s">nos próximos 60 dias</div></div>
  <div class="kpi ${cold.length?'alert':''}"><div class="l">Sem contato há 30+ dias</div><div class="v">${cold.length}</div><div class="s">de ${act.length} clientes ativos</div></div></div>
 <div class="grid2">
  <section class="panel"><h2>Follow-ups <span class="sub">${pend.length} pendente${pend.length===1?'':'s'}</span></h2>${mm?`<div class="chips" style="margin-bottom:8px"><button class="chip" data-act="fu-mine" aria-pressed="${!!ui.fuMine}">Só os meus</button></div>`:''}<div class="tasks">${pend.length?pend.slice(0,12).map(f=>fuRow(f,true)).join(''):emptyBox('Nenhum follow-up pendente','Eles são criados sozinhos 7 a 15 dias depois de um criativo publicado, um projeto concluído ou uma campanha no ar.')}</div>
   <div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="fu-new">+ Follow-up</button></div></section>
  <section class="panel"><h2>Aguardando o cliente <span class="sub">lista de cobrança</span></h2><div class="list">${wq.length?wq.slice(0,12).map(waitRow).join(''):emptyBox('Nada parado com os clientes','Quando uma tarefa ficar “Aguardando cliente” ou houver pendência de onboarding, ela aparece aqui.')}</div></section></div>
 <div class="grid2">
  <section class="panel"><h2>Renovações e reajustes <span class="sub">próximos 60 dias</span></h2><div class="list">${ren.length?ren.map(x=>`<button class="item" data-act="open-client" data-id="${x.c.id}"><span class="stripe s-${x.n<=15?'critico':x.n<=30?'alto':'medio'}"></span><span><span class="t">${esc(x.c.name)}</span><span class="m"><span>${esc(x.k)}</span><span>${money(x.c.value)}/mês</span><span>${esc(mName(relOwner(x.c)))}</span></span></span><span class="r"><span class="when ${x.n<0?'late':x.n<=30?'soon':''}">${x.n<0?'venceu há '+(-x.n)+'d':x.n===0?'hoje':'em '+x.n+' dias'}</span><span class="when">${fD(x.date)}</span></span></button>`).join(''):emptyBox('Nada para renovar nos próximos 60 dias','Preencha início, fim e reajuste do contrato na passagem de bastão ou em “Editar”.')}</div></section>
  <section class="panel"><h2>Resultados de ${MN[+pm.slice(5)-1]} para registrar <span class="sub">${rp.length}</span></h2><div class="list">${rp.length?rp.map(c=>`<div class="item" style="cursor:default"><span class="stripe s-medio"></span><span><span class="t">${esc(c.name)}</span><span class="m"><span>${esc(mName(relOwner(c)))}</span>${resOf(c.id)[0]?`<span>último: ${MN[+resOf(c.id)[0].month.slice(5)-1]}</span>`:'<span>nenhum mês registrado</span>'}</span></span><span class="r"><button class="btn sm" data-act="rs-new" data-id="${c.id}">Registrar</button></span></div>`).join(''):emptyBox('Todos os resultados do mês passado registrados','Registre leads, alcance, CPL e vendas de cada cliente no início do mês.')}</div></section></div>
 <section class="panel" style="padding:8px"><h2 style="padding:8px 8px 0">Carteira de relacionamento <span class="sub">clientes ativos, do contato mais antigo ao mais recente</span></h2><div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Último contato</th><th>Próximo follow-up</th><th>Satisfação</th><th>Responsável</th></tr></thead><tbody>
  ${L.map(({c,l,n})=>{const ds=l?daysSince(l):null;return `<tr class="click" data-act="fu-client" data-id="${c.id}"><td><b>${esc(c.name)}</b><br><small style="color:var(--muted)">${esc(c.segment||'')}</small></td><td class="num"><span class="when ${ds===null||ds>30?'late':ds>15?'soon':''}">${l?fD(l)+' · há '+ds+'d':'nunca'}</span></td><td class="num">${n?`<span class="when ${fuState(n)==='late'?'late':fuState(n)==='warn'?'soon':''}">${esc(fuWhen(n))}</span>`:'—'}</td><td class="num">${c.satisfaction?c.satisfaction+'/5':'—'}</td><td style="white-space:nowrap">${av(relOwner(c))} ${esc(mName(relOwner(c)))}</td></tr>`}).join('')||`<tr><td colspan="5">${emptyBox('Nenhum cliente ativo','')}</td></tr>`}</tbody></table></div></section>`}
function onboardingBody(){const pool=S.clients.filter(c=>c.stage==='Fechado'||(c.onboarding?.startedAt&&c.stage!=='Perdido'));
 const rows=pool.map(c=>{const ob=c.onboarding||{};const done=CHECK.filter(i=>ob.checklist?.[i.id]?.done).length;const pct=Math.round(done/CHECK.length*100);const pend=CHECK.filter(i=>i.who==='cliente'&&!ob.checklist?.[i.id]?.done).length;return{c,ob,done,pct,pend}}).sort((a,b)=>a.pct-b.pct);

 <div class="list" style="gap:8px">${L.map(c=>{const n=stNext(c.id);const st=n&&fuState(n);const lu=S.updates.filter(u=>u.clientId===c.id).sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];

function stTimeline(c){const f=ui.stFilter||'all';const ev=[];
 if(f==='all'||f==='up')S.updates.filter(u=>u.clientId===c.id).forEach(u=>ev.push({at:u.at,kind:u.kind||'Atualização',cls:UP_CLS[u.kind]||'',text:u.text,acc:u.by,mid:u.byMember,up:u}));
 if(f==='all'||f==='fu')S.follows.filter(x=>x.clientId===c.id&&x.status==='Feito').forEach(x=>ev.push({at:(x.doneAt||'')+'T23:59',dateOnly:true,kind:x.type===ST_TYPE?'Follow-up estratégico':isCad(x)?'Contato comercial':'Follow-up',cls:'p-alto',text:[x.result&&'Resultado: '+x.result,x.notes,x.business&&'Negócio: '+x.business,x.life&&'Momento de vida: '+x.life,x.opportunity&&'Oportunidade: '+x.opportunity].filter(Boolean).join('\n'),acc:x.doneBy,mid:x.doneMember,act:['fu-view',x.id]}));
 if(f==='all')(c.notes||[]).forEach(n=>ev.push({at:(n.at||'')+'T00:00',dateOnly:true,kind:'Observação',cls:'',text:n.text,acc:n.by}));

 const resp=[['Relacionamento',mName(relOwner(c))],['Estratégia',strategistOf(c)?mName(strategistOf(c)):'Vazio'],['Comercial',mName(c.ownerId)]];

  <div class="st-info" style="margin-top:14px">${info.map(([l,v,raw])=>`<div><span>${l}</span><b>${raw?v:esc(v)}</b></div>`).join('')}</div></div></div>

   ${c.packageNotes?`<p style="margin:8px 0 0;white-space:pre-wrap">${esc(c.packageNotes)}</p>`:''}</div>
  <div class="row" style="gap:18px;margin-top:12px">${resp.map(([l,v])=>`<span style="font-size:13px"><span style="color:var(--muted)">${l}:</span> <b>${esc(v)}</b></span>`).join('')}</div></section>
 <div class="st-prof"><h3>Perfil do cliente · antes de entrar em contato</h3>
  ${ps||p.tone||p.care||p.values||p.channel?`${ps?`<div><span class="pill p-alto">${esc(ps[1])}</span> <span style="font-size:14px">${esc(ps[2])}</span></div>`:''}

   ${p.care?`<div class="alertbox" style="margin:0"><span>!</span><div><b>Cuidados no contato:</b> ${esc(p.care)}</div></div>`:''}`

   :`<p style="margin:0 0 8px;font-size:14px;color:var(--muted)">Nenhum follow estratégico agendado.</p><button class="btn sm primary" data-act="st-fu" data-id="${c.id}">+ Follow-up estratégico</button>`}
  <div class="row" style="margin-top:10px;gap:6px"><span class="pill">${last?'Último: '+fD(last.doneAt)+(last.result?' · '+esc(last.result):''):'Nenhum feito ainda'}</span><span class="pill p-ok">${posts} post${posts===1?'':'s'} do catálogo publicado${posts===1?'':'s'}${since?' desde '+fD(since):''}</span>${crs?`<span class="pill">${crs} criativo${crs>1?'s':''} publicado${crs>1?'s':''}</span>`:''}</div>

function stDoneRow(t){const p=t.projectId&&byId('projects',t.projectId);const meta=[t.tipo,t.categoria,t.subcategoria].filter(x=>x&&x!=='Não se aplica');
 return `<button class="item" data-act="task-open" data-id="${t.id}"><span class="stripe s-ok"></span><span style="min-width:0"><span class="t">${esc(t.title)}</span><span class="m">${p?`<span>▸ ${esc(p.title)}</span>`:''}${meta.length?`<span>${esc(meta.join(' · '))}${t.qtd>1?' · '+t.qtd+' un.':''}</span>`:''}<span class="row" style="gap:6px;flex-wrap:nowrap">${av(t.assigneeId)}${esc(t.assigneeId?first(t.assigneeId):'Sem responsável')}</span>${t.approval?'<span class="pill p-ok">✓ aprovado pelo cliente</span>':''}</span></span><span class="r"><span class="when">${fD(t.doneAt)}/${String(t.doneAt||'').slice(2,4)}</span></span></button>`}
const stDoneList=cid=>S.todos.filter(t=>t.clientId===cid&&t.status==='Concluída').sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')||(b.updatedAt||'').localeCompare(a.updatedAt||''));
function stDone(c,since){const L=stDoneList(c.id);const mo=thisMonth();const qty=a=>a.reduce((s,t)=>s+(+t.qtd||1),0);
 const m=L.filter(t=>(t.doneAt||'').startsWith(mo)),sl=since?L.filter(t=>(t.doneAt||'')>=since):L;const open=S.todos.filter(t=>t.clientId===c.id&&t.status!=='Concluída').length;
 return `<section class="panel"><h2>Entregas para o cliente <span class="sub">${L.length} tarefa${L.length===1?'':'s'} concluída${L.length===1?'':'s'}</span></h2>
  <div class="row" style="gap:6px;margin-bottom:10px"><span class="pill p-ok">${MN[new Date().getMonth()].replace(/^./,x=>x.toUpperCase())}: ${m.length} tarefa${m.length===1?'':'s'} · ${qty(m)} peça${qty(m)===1?'':'s'}</span>${since?`<span class="pill">Desde o último follow: ${sl.length}</span>`:''}${open?`<span class="pill p-alto">${open} em aberto</span>`:''}</div>
  <div class="list">${L.length?L.slice(0,6).map(stDoneRow).join(''):emptyBox('Nenhuma tarefa concluída ainda','Tudo o que a equipe concluir para este cliente aparece aqui, com quem fez e quando.')}</div>
  ${L.length>6?`<button class="btn sm ghost" style="margin-top:8px" data-act="st-done-all" data-id="${c.id}">Ver todas as ${L.length} entregas</button>`:''}</section>`}
function stDoneAll(cid){const L=stDoneList(cid);const g={};L.forEach(t=>{const k=(t.doneAt||'').slice(0,7)||'—';(g[k]=g[k]||[]).push(t)});
 openModal(`<div class="mh"><div><h2>Entregas · ${esc(cName(cid))}</h2><div style="font-size:13px;color:var(--muted)">${L.length} tarefas concluídas</div></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>
 <div class="mb">${Object.keys(g).sort().reverse().map(k=>`<div class="sec"><h3>${k==='—'?'Sem data':MN[+k.slice(5)-1].replace(/^./,x=>x.toUpperCase())+' de '+k.slice(0,4)} · ${g[k].length}</h3><div class="list">${g[k].map(stDoneRow).join('')}</div></div>`).join('')}</div>
 <div class="mf"><span class="spacer"></span><button class="btn primary" data-act="close">Fechar</button></div>`)}

 ${subTabs('pl-tab',tab,[['radar','Radar de oportunidades',rdN],['catalogo','Catálogo do mês'],['segmentos','Datas por segmento'],['datas','Calendário e campanhas',S.campaigns.filter(x=>x.status!=='Encerrada'&&(x.date||'')>=today()).length]])}
 ${body}`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
 try{switch(a){
 case'rd-per':ui.rdPer=v;refresh();break;
 case'rd-new':radarForm();break;
 case'rd-edit':if(isAdmin())radarForm(byId('radar',id));break;
 case'rd-del':{if(!isAdmin())return;if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar';setTimeout(()=>{b.classList.remove('armed');b.textContent='Arquivar'},4000);return}await del('radar',id);toast('Arquivado');break}
 case'rd-goto':ui.plTab='radar';ui.rdView='lista';modalCtx=null;$('#mwrap').hidden=true;go('planejamento');break;
 case'rd-task':{const r=byId('radar',id),c=byId('clients',v);if(!r||!c)return;const d=rdDay(r);const due=d>ymd(addD(new Date(),2))?ymd(addD(parseD(d),-2)):ymd(addD(new Date(),1));
  taskForm(null,{clientId:c.id,title:'Conteúdo: '+r.title,tipo:'Não se aplica',categoria:'Arte',due,urgent:daysTo(d)<=2,desc:[r.idea&&'Ideia: '+r.idea,r.why&&'Por que importa: '+r.why,'Data: '+fD(d)+(r.eventTime?' às '+r.eventTime:''),r.source?.url&&'Fonte: '+r.source.url].filter(Boolean).join('\n'),requester:'Radar de oportunidades'});break}
 case'seg-fam':ui.segFam=v;ui.segClient='';refresh();break;
 case'sg-open':if(ui.view==='planejamento'&&ui.plTab==='segmentos'&&!b.dataset.client&&sgCtx&&!sgCtx.clientId){sgCtx.fam=ui.segFam;modalCtx?.draw&&modalCtx.draw();modalCtx?.rerender&&modalCtx.rerender()}break;
 }}catch(err){}});

/* ---------- recomendações por segmento · 45 dias ---------- */
Object.assign(ui,{rdView:'lista',recSeg:'all'});
document.head.insertAdjacentHTML('beforeend',`<style>
.recg{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.recc{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.recc h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.recc h3 small{font-size:12.5px;color:var(--muted);font-weight:500}
.reci{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.reci .d{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);line-height:1.3}.reci .d b{display:block;font-size:17px;color:var(--ink)}
.reci .t{font-weight:600;font-size:14.5px;line-height:1.3}.reci p{margin:4px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.reci .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
</style>`);
function recFor(fam,days){const t=today(),lim=ymd(addD(new Date(),days||45));const out=[];
 S.radar.filter(r=>{const d=rdDay(r);const sg=r.segments||[];return d>=t&&d<=lim&&(sg.includes(fam)||sg.includes('todos'))}).forEach(r=>out.push({src:'radar',d:rdDay(r),time:r.eventTime,title:r.title,kind:r.kind,idea:r.idea||r.why||'',r,gen:!(r.segments||[]).includes(fam)}));
 const pseudo={id:'__rec',segment:(FAMS[fam]?.kw||[]).join(' ')};
 DT_YEARS.flatMap(y=>allDatesYear(y)).filter(d=>!d.clientId&&!d.month&&d.date>=t&&d.date<=lim).forEach(d=>{const spec=relevantTo(d,pseudo);if(!spec&&!['comercial','feriado'].includes(d.cat))return;const nm=d.name.split(' · ')[0].toLowerCase().replace(/^dia (nacional |mundial |internacional )?(d[aeo]s? )?/,'');if(out.some(x=>x.src==='radar'&&(x.d===d.date||(x.title+' '+(x.r.tags||[]).join(' ')).toLowerCase().includes(nm))))return;
  let idea=d.tip||'';try{const pb=playbook(d,fam);if(pb?.ideas?.[0])idea=pb.ideas[0].t+(pb.ideas[0].g?': '+pb.ideas[0].g.replace(/^“|”$/g,''):'')}catch(e){}out.push({src:'data',d:d.date,title:d.name,kind:DT_CATS[d.cat][0],idea,dt:d,gen:!spec})});
 return out.sort((a,b)=>a.d.localeCompare(b.d)||(a.time||'').localeCompare(b.time||''))}
function recGeneral(days){const t=today(),lim=ymd(addD(new Date(),days||45));const out=[];
 S.radar.filter(r=>{const d=rdDay(r);return d>=t&&d<=lim&&(r.segments||[]).includes('todos')}).forEach(r=>out.push({src:'radar',d:rdDay(r),time:r.eventTime,title:r.title,kind:r.kind,idea:r.idea||r.why||'',r}));
 DT_YEARS.flatMap(y=>allDatesYear(y)).filter(d=>!d.clientId&&!d.month&&d.date>=t&&d.date<=lim&&['comercial','feriado'].includes(d.cat)&&!S.radar.some(r=>rdDay(r)===d.date&&(r.segments||[]).includes('todos'))).forEach(d=>out.push({src:'data',d:d.date,title:d.name,kind:DT_CATS[d.cat][0],idea:d.tip||'',dt:d}));
 return out.sort((a,b)=>a.d.localeCompare(b.d))}
function recRow(x,fam){const dd=parseD(x.d);const n=daysTo(x.d);const cls=x.src==='radar'?(RD_CLS[x.kind]||''):'';
 return `<div class="reci"><span class="d"><b>${dd.getDate()}/${pad(dd.getMonth()+1)}</b>${WD[dd.getDay()]}${x.time?' · '+esc(x.time):''}<br><span class="when ${n<=7?'soon':''}">${n===0?'hoje':n===1?'amanhã':'em '+n+'d'}</span></span>
  <div style="min-width:0"><span class="row" style="gap:6px"><span class="pill ${cls}">${esc(x.kind)}</span>${x.src==='radar'?'<span class="pill">radar</span>':''}${x.gen?'':'<span class="pill p-ok">★ do segmento</span>'}</span><div class="t" style="margin-top:4px">${esc(x.title)}</div>${x.idea?`<p>${esc(x.idea)}</p>`:''}
  <div class="acts">${x.src==='data'?`<button class="btn sm dark" data-act="rec-sug" data-v="${esc(x.dt.key)}" data-fam="${fam||''}">Sugerir conteúdo</button>`:`${x.r.source?.url?`<a class="btn sm" href="${esc(x.r.source.url)}" target="_blank" rel="noopener">Fonte ↗</a>`:''}`}${(()=>{const cl=S.clients.filter(c=>c.stage!=='Perdido'&&(fam?famOf(c)===fam:true)&&(x.src==='radar'?radarMatch(x.r,c):true));return fam&&cl.length?`<select class="lead-sel" data-rectask="${x.src}:${esc(x.src==='radar'?x.r.id:x.dt.key)}" aria-label="Criar conteúdo para um cliente"><option value="">+ Conteúdo para…</option>${cl.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`:''})()}</div></div></div>`}
function vRec45(){const fams=Object.entries(FAMS).filter(([k])=>k!=='geral');const sel=ui.recSeg||'all';
 const shown=sel==='all'?fams:fams.filter(([k])=>k===sel);const mineFams=new Set(S.clients.filter(c=>c.stage!=='Perdido').map(famOf));
 shown.sort((a,b)=>(mineFams.has(b[0])-mineFams.has(a[0])));
 return `<div class="row" style="justify-content:space-between"><button class="btn" data-act="rd-view" data-v="lista">‹ Voltar ao radar</button><span style="color:var(--muted);font-size:13px">De hoje até ${fD(ymd(addD(new Date(),45)))} · radar do dia + calendário de datas</span></div>
 <h2 style="margin:6px 0 0;font-size:24px">O que pode virar conteúdo nos próximos 45 dias</h2>
 <p style="margin:0;color:var(--muted);font-size:14px">Recomendações para cada segmento: acontecimentos do radar, datas do segmento (★) e as datas comerciais e feriados com uma ideia adaptada a cada tipo de empresa. Segmentos com clientes (●) aparecem primeiro.</p>
 <div class="chips"><button class="chip" data-act="rec-seg" data-v="all" aria-pressed="${sel==='all'}">Todos os segmentos</button>${fams.map(([k,f])=>`<button class="chip" data-act="rec-seg" data-v="${k}" aria-pressed="${sel===k}">${esc(f.l)}${mineFams.has(k)?' ●':''}</button>`).join('')}</div>
 <div class="recg" ${sel!=='all'?'style="grid-template-columns:1fr;max-width:900px"':''}>${shown.map(([k,f])=>{const L=recFor(k,45);const sp=L.filter(x=>!x.gen).length;const V=sel==='all'?L.slice(0,6):L;return `<div class="recc"><h3><span>${esc(f.l)}</span><small>${sp} do segmento · ${L.length} no total${mineFams.has(k)?' · '+S.clients.filter(c=>c.stage!=='Perdido'&&famOf(c)===k).length+' cliente(s)':''}</small></h3>${V.map(x=>recRow(x,k)).join('')||'<p style="margin:0;color:var(--muted);font-size:13.5px">Nada nos próximos 45 dias.</p>'}${sel==='all'&&L.length>6?`<button class="btn sm ghost" data-act="rec-seg" data-v="${k}">Ver as ${L.length} recomendações →</button>`:''}</div>`}).join('')}</div>`}
// hook into radar view
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='rd-view'){ui.rdView=v;refresh();window.scrollTo(0,0)}
 if(a==='rec-seg'){ui.recSeg=v;refresh()}
 if(a==='rec-sug'){suggestModal(v,'');if(sgCtx&&b.dataset.fam){sgCtx.fam=b.dataset.fam;modalCtx?.rerender&&modalCtx.rerender();modalCtx?.draw&&modalCtx.draw()}}});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset?.rectask||!t.value)return;const[src,key]=t.dataset.rectask.split(':');const c=byId('clients',t.value);t.value='';if(!c)return;
 if(src==='radar'){const r=byId('radar',key);if(!r)return;const d=rdDay(r);taskForm(null,{clientId:c.id,title:'Conteúdo: '+r.title,categoria:'Arte',due:d>ymd(addD(new Date(),2))?ymd(addD(parseD(d),-2)):ymd(addD(new Date(),1)),urgent:daysTo(d)<=2,requester:'Radar de oportunidades',desc:[r.idea&&'Ideia: '+r.idea,r.why&&'Por que importa: '+r.why,'Data: '+fD(d)+(r.eventTime?' às '+r.eventTime:''),r.source?.url&&'Fonte: '+r.source.url].filter(Boolean).join('\n')});return}
 const dt=findDate(key);if(!dt)return;let idea=dt.tip||'';try{const pb=playbook(dt,famOf(c),c);if(pb?.ideas?.[0])idea=pb.ideas[0].t}catch(x){}
 taskForm(null,{clientId:c.id,title:'Conteúdo: '+dt.name,categoria:'Arte',due:dt.date>ymd(addD(new Date(),4))?ymd(addD(parseD(dt.date),-3)):ymd(addD(new Date(),1)),requester:'Radar · recomendações 45 dias',desc:['Data: '+fD(dt.date)+'/'+dt.date.slice(0,4)+' · '+dt.name,idea&&'Ideia: '+idea].filter(Boolean).join('\n')})});

/* ===== Radar: criar tarefa direto da sugestão ===== */
function rdDue(d,ant){return d>ymd(addD(new Date(),ant))?ymd(addD(parseD(d),-ant)):ymd(addD(new Date(),1))}
function fmtTask(f){f=(f||'').toLowerCase();if(f.includes('reel')||f.includes('vídeo')||f.includes('video'))return{categoria:'Edição de vídeo',subcategoria:'Reels'};if(f.includes('stor'))return{categoria:'Arte',subcategoria:'Stories'};if(f)return{categoria:'Arte',subcategoria:'Feed'};return{categoria:'Arte'}}
function rdTaskOpen(pre){taskForm(null,{requester:'Radar de oportunidades',tipo:'Não se aplica',...pre})}
rdCard=(o=>function(r){const h=o(r);const cl=radarClients(r);const one=cl.length===1?cl[0].id:'';
 return h.replace('<span style="flex:1"></span>',`<button class="btn sm primary" data-act="rd-mktask" data-id="${r.id}" data-v="${one}" title="Criar uma tarefa para alguém da equipe a partir desta oportunidade">+ Criar tarefa</button><span style="flex:1"></span>`)})(rdCard);
recRow=(o=>function(x,fam){const h=o(x,fam);const key=x.src==='radar'?x.r.id:x.dt.key;
 return h.replace('<div class="acts">',`<div class="acts"><button class="btn sm primary" data-act="rec-mktask" data-v="${x.src}:${esc(key)}" data-fam="${fam||''}">+ Criar tarefa</button>`)})(recRow);
ideaCard=(o=>function(x,src,i,canUse){const h=o(x,src,i,canUse);
 return h.replace(/(<\/span><\/span>)(<button class="btn sm" data-act="sg-use"[^>]*>Usar em campanha<\/button>)?<\/div>/,(m,a,b)=>`${a}<span class="row" style="gap:6px"><button class="btn sm primary" data-act="sg-mktask" data-v="${src}:${i}">+ Criar tarefa</button>${b||''}</span></div>`)})(ideaCard);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v||'',id=b.dataset.id;
 if(a==='rd-mktask'){const r=byId('radar',id);if(!r)return;const d=rdDay(r);
  rdTaskOpen({clientId:v,title:'Conteúdo: '+r.title,...fmtTask(''),due:rdDue(d,2),urgent:daysTo(d)<=2,desc:[r.idea&&'Ideia: '+r.idea,r.why&&'Por que importa: '+r.why,r.summary&&'Contexto: '+r.summary,'Data do acontecimento: '+fD(d)+(r.eventTime?' às '+r.eventTime:''),r.source?.url&&'Fonte: '+r.source.url].filter(Boolean).join('\n')})}
 if(a==='rec-mktask'){const[src,key]=v.split(':');const fam=b.dataset.fam;
  if(src==='radar'){const r=byId('radar',key);if(!r)return;const cl=S.clients.filter(c=>c.stage!=='Perdido'&&(!fam||famOf(c)===fam)&&radarMatch(r,c));const d=rdDay(r);
   rdTaskOpen({clientId:cl.length===1?cl[0].id:'',title:'Conteúdo: '+r.title,...fmtTask(''),due:rdDue(d,2),urgent:daysTo(d)<=2,desc:[r.idea&&'Ideia: '+r.idea,r.why&&'Por que importa: '+r.why,'Data do acontecimento: '+fD(d)+(r.eventTime?' às '+r.eventTime:''),r.source?.url&&'Fonte: '+r.source.url].filter(Boolean).join('\n')});return}
  const dt=findDate(key);if(!dt)return;const cl=fam?S.clients.filter(c=>c.stage!=='Perdido'&&famOf(c)===fam):[];let idea=dt.tip||'',fmt='';
  try{const pb=playbook(dt,fam||famOf(cl[0]),cl[0]);if(pb?.ideas?.[0]){idea=pb.ideas[0].t;fmt=pb.ideas[0].fmt}}catch(x){}
  rdTaskOpen({clientId:cl.length===1?cl[0].id:'',title:'Conteúdo: '+dt.name,...fmtTask(fmt),due:rdDue(dt.date,3),requester:'Radar · recomendações 45 dias',desc:['Data: '+fD(dt.date)+' · '+dt.name,fam&&FAMS[fam]&&'Segmento: '+FAMS[fam].l,idea&&'Ideia: '+idea].filter(Boolean).join('\n')})}
 if(a==='sg-mktask'){if(!sgCtx)return;const[src,i]=v.split(':');const pb=sgCtx.pb,sv=sgCtx.saved;const x=src==='ai'?sv?.ideas?.[+i]:pb?.ideas?.[+i];if(!x)return;const dt=findDate(sgCtx.key);if(!dt)return;
  rdTaskOpen({clientId:sgCtx.clientId||'',title:x.fmt+': '+x.t.replace(/[“”"]/g,''),...fmtTask(x.fmt),due:rdDue(dt.date,3),requester:'Radar · sugestões de conteúdo',
   desc:['Data: '+fD(dt.date)+' · '+dt.name,x.g&&'Gancho: '+x.g,x.e&&'Estrutura: '+x.e,x.cta&&'Chamada: '+x.cta,x.etapa&&'Etapa do funil: '+x.etapa,(src==='ai'?sv?.oferta:pb?.offer)&&'Oferta: '+(src==='ai'?sv.oferta:pb.offer)].filter(Boolean).join('\n')})}
},true);

init();
})();
</script>
